---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  default:
    desc: run the prek hooks
    cmds:
      - task: run

  init:
    desc: install the prek git hooks
    internal: true
    status:
      - test -f .git/hooks/pre-commit
      - grep -q prek .git/hooks/pre-commit
    cmds:
      - prek install

  run:
    desc: run the prek hooks
    deps: [init]
    internal: true
    cmds:
      - prek run --all-files
