---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  all:
    - task: markdown
    - task: yaml
    - task: prettier

  markdown:
    desc: Lint Markdown
    cmds:
      - "prek run markdownlint-fix --all-files"

  yaml:
    desc: Lint YAML
    cmds:
      - "prek run yamllint --all-files"

  prettier:
    desc: Lint with prettier
    cmds:
      - "prek run prettier --all-files"

  prettier:fix:
    desc: Lint with prettier autofix
    cmds:
      - "prek run prettier --all-files"
