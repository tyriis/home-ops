---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# One parameterized command per operation — the cluster is a variable
# (cluster=main|utility). Shared endpoint table: .taskfiles/talos/clusters.sh.
# Generic scripts (render/apply/dry-run/gen-talosconfig), nothing ever on disk
# but tmpfs. Talos/Kubernetes VERSION UPGRADES are owned by tuppr — no
# upgrade tasks here.

tasks:
  init:
    desc: "Generate a fresh talsecret for a NEW cluster, encrypted straight to sops (cluster=)"
    cmds:
      - bash -c 'umask 077; talosctl gen secrets --output-file - | sops /dev/stdin > talos/{{.cluster}}/talsecret.sops.yaml'
    requires:
      vars: [cluster]

  render:
    desc: "Render machine config to stdout (cluster=, node=)"
    cmds:
      - "./.taskfiles/talos/render-config.sh {{.cluster}} {{.node}}"
    requires:
      vars: [cluster, node]

  diff:
    desc: "Doc-level diff live vs rendered — offline-capable patch review (cluster=, node=, ip=)"
    cmds:
      - "./.taskfiles/talos/apply-config.sh {{.cluster}} {{.node}} {{.ip}} --diff-only"
    requires:
      vars: [cluster, node, ip]

  dry:
    desc: "STANDARD PRE-APPLY GATE — node's own reboot plan + redacted diff; nothing applied (cluster=, node=, ip=)"
    cmds:
      - "./.taskfiles/talos/dry-run-config.sh {{.cluster}} {{.node}} {{.ip}}"
    requires:
      vars: [cluster, node, ip]

  apply:
    desc: "Diff, confirm, apply — nothing ever written to disk (cluster=, node=, ip=)"
    cmds:
      - "./.taskfiles/talos/apply-config.sh {{.cluster}} {{.node}} {{.ip}}"
    requires:
      vars: [cluster, node, ip]

  talosconfig:
    desc: "Regenerate client cert + merge into central ~/.talos/config (cluster=, nodes=<ips> REQUIRED; default context stays yours — set via 'talosctl config context <name>')"
    cmds:
      - "./.taskfiles/talos/gen-talosconfig.sh {{.cluster}} {{.nodes}}"
    requires:
      vars: [cluster, nodes]

  install:
    desc: "Fresh install of a new/replaced node: render + INSECURE maintenance-mode apply (cluster=, node=, ip=)"
    prompt: "Install rendered config {{.cluster}}/{{.node}} onto {{.ip}} via insecure maintenance apply?"
    cmds:
      - bash -c 'tmp="$(mktemp /dev/shm/talos-install.XXXXXX.yaml)"; trap "rm -f \"$tmp\"" EXIT; chmod 600 "$tmp"; ./.taskfiles/talos/render-config.sh {{.cluster}} {{.node}} > "$tmp" && talosctl apply-config --insecure --nodes {{.ip}} --file "$tmp"'
    requires:
      vars: [cluster, node, ip]

  backup-etcd:
    desc: "etcd snapshot to ~/backups/talos-dr (cluster=, node=)"
    cmds:
      - bash -c 'mkdir -p ~/backups/talos-dr; talosctl --context {{.cluster}} -n {{.node}} etcd snapshot ~/backups/talos-dr/{{.cluster}}-$(date +%Y%m%dT%H%M%S).snapshot'
    requires:
      vars: [cluster, node]

  dashboard:
    desc: "talosctl dashboard on a node (cluster=, node=<ip>)"
    cmds:
      - "talosctl --context {{.cluster}} dashboard -n {{.node}}"
    requires:
      vars: [cluster, node]

  etcd-defrag:
    desc: "Rolling etcd defrag — only nodes >threshold% free, one at a time, etcd LEADER last (cluster=, nodes=<ips>, threshold=)"
    # usage: task talos:etcd-defrag cluster=main nodes="192.168.100.101 192.168.100.102 192.168.100.103"
    # non etcd members (workers) among the nodes are reported + skipped — only
    # etcd members have a DB to defrag; non-members should come first per policy
    cmds:
      - "./.taskfiles/talos/etcd-defrag.sh {{.cluster}} {{.threshold | default 50}} {{.nodes}}"
    requires:
      vars: [cluster, nodes]
