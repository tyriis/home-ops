# talos03 node patch — extracted from live machineconfig 2026-10-30
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: talos03

---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("0-1.0", link.bus_path)

---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel1
selector:
  match: glob("1-1.0", link.bus_path)

---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: bond0-m0
selector:
  match: glob("58:47:ca:76:7f:73", mac(link.permanent_addr)) && glob("i40e", link.driver)

---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: bond0-m1
selector:
  match: glob("58:47:ca:76:7f:74", mac(link.permanent_addr)) && glob("i40e", link.driver)

---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - bond0-m0
  - bond0-m1
bondMode: 802.3ad
miimon: 100
updelay: 200
downdelay: 200
xmitHashPolicy: layer3+4
lacpRate: fast
mtu: 9000
addresses:
  - address: 192.168.101.103/24
routes:
  - destination: 192.168.101.0/24
    gateway: 192.168.101.1

---
apiVersion: v1alpha1
kind: DHCPv4Config
name: enp89s0

---
apiVersion: v1alpha1
kind: DHCPv4Config
name: enp87s0

---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.100.100
link: enp89s0

---
apiVersion: v1alpha1
kind: LinkConfig
name: enp89s0
mtu: 1500

---
apiVersion: v1alpha1
kind: LinkConfig
name: enp87s0
mtu: 1500

---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 65520
addresses:
  - address: 169.254.255.103/32
routes:
  - destination: 169.254.255.101/32
    metric: 2048

---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel1
mtu: 65520
addresses:
  - address: 169.254.255.103/32
routes:
  - destination: 169.254.255.102/32
    metric: 2048

---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer-secureboot/8d69cb80518ea3baf4659d9946488a3bbe9f454df5707e5ee355b82917f495fe:v1.14.5
provisioning:
  diskSelector:
    match: disk.serial == "S7HDNL0YA54989Z"
  wipe: false
