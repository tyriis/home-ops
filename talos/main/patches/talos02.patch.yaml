# talos02 node patch — extracted from live machineconfig 2026-10-30
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: talos02

---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("0-1.0", link.bus_path)

---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel1
selector:
  match: glob("1-1.0", link.bus_path)

---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: bond0-m0
selector:
  match: glob("58:47:ca:76:87:47", mac(link.permanent_addr)) && glob("i40e", link.driver)

---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: bond0-m1
selector:
  match: glob("58:47:ca:76:87:48", mac(link.permanent_addr)) && glob("i40e", link.driver)

---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - bond0-m0
  - bond0-m1
bondMode: 802.3ad
miimon: 100
updelay: 200
downdelay: 200
xmitHashPolicy: layer3+4
lacpRate: fast
mtu: 9000
addresses:
  - address: 192.168.101.102/24
routes:
  - destination: 192.168.101.0/24
    gateway: 192.168.101.1

---
# bond MAC is inherited from the first link (enp89s0); DHCP reservation 192.168.100.102 and the VIP both key off 58:47:ca:76:87:4a
# switch side: USW Pro HD 24 PoE, LACP group on ports 17+18, VLAN 100 (SERVERS)
apiVersion: v1alpha1
kind: BondConfig
name: bond1
links:
  - enp89s0
  - enp87s0
bondMode: 802.3ad
miimon: 100
updelay: 200
downdelay: 200
xmitHashPolicy: layer3+4
lacpRate: fast
mtu: 1500

---
apiVersion: v1alpha1
kind: DHCPv4Config
name: bond1

---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.100.100
link: bond1

---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 65520
addresses:
  - address: 169.254.255.102/32
routes:
  - destination: 169.254.255.101/32
    metric: 2048

---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel1
mtu: 65520
addresses:
  - address: 169.254.255.102/32
routes:
  - destination: 169.254.255.103/32
    metric: 2048

---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
# installer.image is derived at render time (schematic id + version.yaml)
provisioning:
  diskSelector:
    match: disk.serial == "S7HDNF0Y440119F"
  wipe: false
