---
# factory.talos.dev schematic for the `main` cluster (secureboot UKI metal installer).
# id: 8d69cb80518ea3baf4659d9946488a3bbe9f454df5707e5ee355b82917f495fe
# The id must equal the installer image refs in talos/main/patches/*.patch.yaml.
# Ref: https://factory.talos.dev/schematics
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/i915
      - siderolabs/intel-ucode
      - siderolabs/thunderbolt
  extraKernelArgs:
    - apparmor=0
    - init_on_alloc=0
    - init_on_free=0
    - intel_iommu=on
    - iommu=pt
    - mitigations=off
    - security=none
    - talos.auditd.disabled=1
