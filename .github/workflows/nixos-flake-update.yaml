---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Weekly bump of the nixos/flake.lock nixpkgs pin (bifrostix docker-lane pilot, #11792).
# Nix-native by design: Renovate's beta nix manager delegates to an external nix
# binary anyway, so this job runs nix itself, verifies the system builds, and
# opens a PR whose body summarizes what moved inside nixpkgs.
# The gate before switching a host stays manual: nvd diff on the host, then
# nixos-rebuild switch, then the reboot self-recovery probe.
name: NixOS Flake Update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 3"

permissions:
  contents: read

jobs:
  bump:
    name: Bump nixpkgs pin
    runs-on: ubuntu-latest
    steps:
      # https://github.com/marketplace/actions/harden-runner
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # https://github.com/marketplace/actions/create-github-app-token
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      # https://github.com/marketplace/actions/install-nix
      - name: Install Nix
        uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31.11.5
        with:
          # Flake input fetches are GitHub API calls. Without a token,
          # anonymous rate limits fail the run intermittently. Bot App
          # token, as all automations here.
          github_access_token: ${{ steps.app-token.outputs.token }}

      - name: Update flake lock
        id: update
        working-directory: nixos
        run: |
          set -euo pipefail
          OLD=$(git show HEAD:nixos/flake.lock | jq -r .nodes.nixpkgs.locked.rev)
          nix flake update nixpkgs
          NEW=$(jq -r .nodes.nixpkgs.locked.rev flake.lock)
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "nixpkgs pin unchanged at \`${OLD}\` - no PR opened." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          # Build the toplevel at the new pin so a PR only ever opens on a
          # green eval. Binary cache covers most of the closure.
          nix build .#nixosConfigurations.bifrostix.config.system.build.toplevel \
            --no-link --print-build-logs

      - name: Summarize nixpkgs range
        if: steps.update.outputs.bumped == 'true'
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          OLD: "${{ steps.update.outputs.old }}"
          NEW: "${{ steps.update.outputs.new }}"
        run: |
          set -euo pipefail
          # The compare endpoint response has multiple top-level keys, so
          # gh --paginate refuses it. Walk pages until one comes back empty.
          : > commits.txt
          page=1
          while :; do
            chunk=$(gh api "repos/NixOS/nixpkgs/compare/${OLD}...${NEW}?per_page=100&page=${page}" \
              --jq '.commits[].commit.message | split("\n")[0]')
            [ -n "$chunk" ] || break
            printf '%s\n' "$chunk" >> commits.txt
            page=$((page + 1))
          done
          grep -Ei '(docker|runc|containerd|openssh|linuxPackages|glibc|systemd|btrfs-progs|earlyoom|audit|sudo|polkit|nixStable|nixUnstable|cni)' commits.txt \
            | awk '!seen[$0]++' | head -120 > notes.txt || true
          wc -l notes.txt

      - name: Stage branch and PR body
        if: steps.update.outputs.bumped == 'true'
        id: commit
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          OLD: "${{ steps.update.outputs.old }}"
          NEW: "${{ steps.update.outputs.new }}"
        run: |
          set -euo pipefail
          TODAY="$(date -u +%Y-%m-%d)"
          BRANCH="chore/nixos-flake-$(date -u +%Y%m%d)"
          # multi-file-commit does not create branches; point one at the
          # checked-out main commit first, via the App identity.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/heads/${BRANCH}" -f "sha=${GITHUB_SHA}"
          {
            echo "## Pin"
            echo ""
            echo "| | rev |"
            echo "|---|---|"
            echo "| old | \`${OLD}\` |"
            echo "| new | \`${NEW}\` |"
            echo ""
            echo "Full nixpkgs range: <https://github.com/NixOS/nixpkgs/compare/${OLD}...${NEW}>"
            echo ""
            echo "## Host-relevant changes (filtered merge titles)"
            echo ""
            echo '```'
            cat notes.txt
            echo '```'
            echo ""
            echo "## Gate before any host switch"
            echo ""
            echo "- On bifrostix: nvd against the new toplevel, review version diffs."
            echo "- nixos-rebuild switch, reboot self-recovery probe, one risky control per rebuild."
            echo "- Generation rollback is the escape lane. Do not boot-loaders unless planned."
          } > /tmp/pr-body.md
          echo "today=${TODAY}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Commit lockfile (signed)
        if: steps.update.outputs.bumped == 'true'
        # Over the GitHub API, not git push: a commit created by the App
        # is signed by GitHub and lands Verified. A local `git commit`
        # by a bot has no signing identity and would break the
        # protected-branch signed-commits rule.
        uses: tyriis/multi-file-commit@2d6dcce35c5e8a7c2f945fb9854cfe9d6c81cc7 # v1.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.commit.outputs.branch }}
          files: nixos/flake.lock
          message: "chore(nixos): bump nixpkgs pin ${{ steps.commit.outputs.today }}"

      - name: Open PR
        if: steps.update.outputs.bumped == 'true'
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
        run: |
          set -euo pipefail
          gh pr create --base main --head "${{ steps.commit.outputs.branch }}" \
            --title "chore(nixos): bump nixpkgs pin ${{ steps.commit.outputs.today }}" \
            --body-file /tmp/pr-body.md
