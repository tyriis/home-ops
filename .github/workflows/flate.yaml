---
name: flate

on:
  pull_request:
    branches:
      - main
    paths:
      - kubernetes/**.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: flate / filter
    runs-on: ubuntu-latest
    outputs:
      clusters: ${{ steps.build-clusters.outputs.clusters }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            main:
              - kubernetes/main/**
              - kubernetes/base/**
              - kubernetes/components/**
            utility:
              - kubernetes/utility/**
              - kubernetes/base/**
              - kubernetes/components/**

      - name: build clusters list
        id: build-clusters
        run: |
          CLUSTERS=$(echo '${{ steps.changed-files.outputs.changed_keys }}' | jq -Rc 'split(" ") | map(select(length > 0))')
          echo "clusters=$CLUSTERS" >> "$GITHUB_OUTPUT"
          echo "affected clusters: $CLUSTERS"

  diff:
    if: ${{ needs.filter.outputs.clusters != '[]' }}
    needs: filter
    name: flate diff / ${{ matrix.cluster }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cluster: ${{ fromJSON(needs.filter.outputs.clusters) }}
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: generate token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: clear comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/flate-diff/${{ matrix.cluster }}
          message: |
            ### flate diff (${{ matrix.cluster }}) - generating...

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5

      - name: run flate
        id: diff
        run: |
          DIFF="$(flate diff all --path kubernetes/${{ matrix.cluster }}/flux -o github)"
          # The diff is handed to the comment action as one step output, which becomes a single
          # process argument. Linux caps an argument at 128 KiB (MAX_ARG_STRLEN), so a large diff
          # makes the action fail to start with "Argument list too long". Cap the posted body and
          # point at the job log, where the full diff is still printed.
          MAX_LINES=400
          TOTAL_LINES="$(printf '%s' "$DIFF" | wc -l)"
          TRUNCATED=""
          if [[ $TOTAL_LINES -gt $MAX_LINES ]]; then
            DIFF="$(printf '%s\n' "$DIFF" | head -n "$MAX_LINES")"
            TRUNCATED="
          truncated: showing the first ${MAX_LINES} of ${TOTAL_LINES} lines. The complete diff is in this job's log."
          fi
          {
            echo "message<<EOF"
            echo "### flate diff (${{ matrix.cluster }})"
            if [[ -n $DIFF ]]; then
              echo '```diff'
              echo "$DIFF"
              echo '```'
              echo "$TRUNCATED"
            else
              echo "no changes found"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: add comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/flate-diff/${{ matrix.cluster }}
          message: ${{ steps.diff.outputs.message }}
