---
# deadvalues: Helm values dead-code checker (https://github.com/guarnz/deadvalues)
# PRs scan only apps whose files changed (--changed-since, fast); manual
# workflow_dispatch runs the full scan on demand.
# Non-blocking reports: findings land in the job summary, neither job gates the PR.
name: deadvalues

on:
  pull_request:
    paths:
      - "**/*.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: deadvalues / report
    runs-on: ubuntu-latest
    # first full run took ~14min on the 4-vCPU runner; manual-dispatch full scans keep headroom
    timeout-minutes: 25
    # non-blocking: findings are reported, not enforced
    continue-on-error: true
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --changed-since needs history down to the base commit
          fetch-depth: 0

      - name: download deadvalues
        run: ./hack/get-deadvalues.sh

      - name: scan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # PRs: only apps whose files changed (fast). Manual dispatch: full scan (on-demand).
          rc=0
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            scan_args=(--changed-since "${PR_BASE_SHA}")
            echo "scoping scan to apps changed since ${PR_BASE_SHA}"
          else
            scan_args=()
            echo "running full scan"
          fi
          hack/bin/deadvalues scan kubernetes "${scan_args[@]}" -o markdown --details --fail-on none > report.md || rc=$?
          {
            echo "## deadvalues scan"
            if [[ ${rc} -ne 0 ]]; then
              echo ""
              echo "_scan finished with findings or errors (exit ${rc}, non-blocking)_"
            fi
            cat report.md
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 0

  diff:
    name: deadvalues / diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # non-blocking: ALIVE -> DEAD regressions are reported for review
    continue-on-error: true
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: download deadvalues
        run: ./hack/get-deadvalues.sh

      - name: diff chart bumps
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE_SHA:-origin/main}"
          rc=0
          hack/bin/deadvalues diff kubernetes --base "${base}" -o markdown > diff.md || rc=$?
          {
            echo "## deadvalues diff (${base})"
            echo ""
            echo "BREAKING = a key that used to work is now DEAD after the chart bump."
            if [[ ${rc} -ne 0 ]]; then
              echo ""
              echo "_diff finished with findings or errors (exit ${rc}, non-blocking)_"
            fi
            cat diff.md
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 0
