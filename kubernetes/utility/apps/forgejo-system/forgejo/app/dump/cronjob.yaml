---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
# Nightly `forgejo dump` -> upload to s3://forgejo-dump/ (spec 6.3).
# The forgejo CLI runs without the image entrypoint, so the custom config
# path and DB connection are provided explicitly.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-dump
spec:
  schedule: "@daily"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          initContainers:
            - name: forgejo-dump
              image: code.forgejo.org/forgejo/forgejo:16.0.4-rootless
              command: ["/bin/sh", "-c"]
              args:
                - forgejo dump --file "/dump/forgejo-dump-$(date +%F).zip" --skip-logs
              env:
                - name: HOME
                  value: /data/gitea/git
                - name: GITEA_CUSTOM
                  value: /data/gitea
                - name: FORGEJO_CUSTOM
                  value: /data/gitea
                - name: FORGEJO__DATABASE__DB_TYPE
                  value: postgres
                - name: FORGEJO__DATABASE__HOST
                  value: forgejo-db-rw.cnpg-system.svc.cluster.local:5432
                - name: FORGEJO__DATABASE__NAME
                  value: forgejo
                - name: FORGEJO__DATABASE__SSL_MODE
                  value: disable
                - name: FORGEJO__DATABASE__USER
                  valueFrom:
                    secretKeyRef:
                      name: forgejo-db-app
                      key: username
                - name: FORGEJO__DATABASE__PASSWD
                  valueFrom:
                    secretKeyRef:
                      name: forgejo-db-app
                      key: password
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: dump
                  mountPath: /dump
          containers:
            - name: upload
              image: docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  mc alias set s3 "$S3_URL" "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY"
                  && mc cp /dump/*.zip s3/forgejo-dump/
              env:
                - name: HOME
                  value: /tmp
              envFrom:
                - secretRef:
                    name: forgejo-dump-s3
              volumeMounts:
                - name: dump
                  mountPath: /dump
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: forgejo-data
            - name: dump
              emptyDir: {}
