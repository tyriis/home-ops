---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/tcproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: forgejo-ssh
  annotations:
    external-dns/unifi: "true"
spec:
  parentRefs:
    - name: envoy
      namespace: networking
      sectionName: ssh
  rules:
    - backendRefs:
        # service port 22 (service.ssh.port); the service targets the
        # container's SSH_LISTEN_PORT 2222 via the named targetPort.
        - name: forgejo-ssh
          port: 22
