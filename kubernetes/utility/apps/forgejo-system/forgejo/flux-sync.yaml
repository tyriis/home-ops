---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forgejo
spec:
  targetNamespace: &namespace forgejo-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/volsync
  path: ./kubernetes/utility/apps/forgejo-system/forgejo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cnpg-cluster
      namespace: cnpg-system
    - name: envoy-gateway
      namespace: networking
    - name: external-secrets-stores
      namespace: secops
    - name: volsync
      namespace: backup-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_SECRETS_PATH: infra/kubernetes/utility/volsync
      VOLSYNC_CAPACITY: 50Gi
      VOLSYNC_STORAGECLASS: local-nvme
      VOLSYNC_SNAPSHOTCLASS: local-nvme
      VOLSYNC_CACHE_SNAPSHOTCLASS: local-nvme
      VOLSYNC_PUID: "1001"
      VOLSYNC_PGID: "1001"
