---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cnpg-barman-cloud
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: cnpg-barman-cloud
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      barman-cloud:
        containers:
          barman-cloud:
            image:
              repository: ghcr.io/cloudnative-pg/plugin-barman-cloud
              tag: v0.16.0@sha256:6404a416718bd7aad943c67a25a7bb20d0558b43edfeab0bf167f013ca435882
            args:
              - operator
              - --server-cert=/server/tls.crt
              - --server-key=/server/tls.key
              - --client-cert=/client/tls.crt
              - --server-address=:9090
              - --leader-elect
              - --log-level=debug
            env:
              SIDECAR_IMAGE: ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.16.0@sha256:c669259e20ed1e11fad821f735c396c19d929985aa05b9544b13ecc8b5a386d0
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  tcpSocket:
                    port: &port 9090

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsGroup: 10001
        runAsUser: 10001

    service:
      barman-cloud:
        forceRename: barman-cloud
        annotations:
          cnpg.io/pluginClientSecret: &clientCert barman-cloud-client-tls
          cnpg.io/pluginPort: "9090"
          cnpg.io/pluginServerSecret: &serverCert barman-cloud-server-tls
        labels:
          cnpg.io/pluginName: barman-cloud.cloudnative-pg.io
        ports:
          tcp:
            port: *port

    persistence:
      server:
        type: secret
        name: *serverCert
      client:
        type: secret
        name: *clientCert
