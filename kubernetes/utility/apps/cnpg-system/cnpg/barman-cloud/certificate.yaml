---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: barman-cloud-client-tls
spec:
  commonName: barman-cloud-client
  duration: 2160h
  isCA: false
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
  renewBefore: 360h
  secretName: barman-cloud-client-tls
  usages:
    - client auth

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: barman-cloud-server-tls
spec:
  commonName: barman-cloud
  duration: 2160h
  isCA: false
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
  renewBefore: 360h
  dnsNames:
    - barman-cloud
  secretName: barman-cloud-server-tls
  usages:
    - server auth
