---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openbao-snapshots
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # https://github.com/bjw-s/helm-charts/blob/main/charts/library/common/values.yaml
  values:
    serviceAccount:
      openbao-snapshots: {}
    controllers:
      openbao-snapshots:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          schedule: "0 6 * * *" # daily at 6am
          timeZone: Europe/Vienna
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: openbao-snapshots
        pod:
          automountServiceAccountToken: true
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
        containers:
          snapshot:
            image:
              repository: quay.io/openbao/openbao
              tag: 2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
            command:
              - /bin/sh
              - -ec
              - |
                mkdir -p /data/snapshots
                export BAO_TOKEN=$(bao write -format=json auth/utility/login role=openbao-snapshots jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" | awk -F'"' '/client_token/{print $4}')
                bao operator raft snapshot save /data/snapshots/openbao-raft.snap
                ls -l /data/snapshots
            env:
              - name: TZ
                value: Europe/Vienna
              - name: BAO_ADDR
                value: http://openbao-active.secops.svc.cluster.local:8200 #NOSONAR allow http
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 10m
                memory: 10Mi
          upload:
            image:
              repository: google/cloud-sdk
              tag: 587.0.0-alpine@sha256:ef78619c8239711d94705ddd3e29d2b24b7482b865ca347c938da6f9bf8b6e92
            command:
              - /bin/sh
              - -ec
              - |
                until [ -f /data/snapshots/openbao-raft.snap ]; do sleep 5; done
                gcloud auth activate-service-account --key-file=/data/credentials/credentials.json
                gsutil cp /data/snapshots/openbao-raft.snap gs://$BUCKET_NAME/openbao_raft_$(date +"%Y%m%d_%H%M%S").snap
            env:
              - name: TZ
                value: Europe/Vienna
              - name: HOME
                value: /data/nobody
            envFrom:
              - secretRef:
                  name: openbao-snapshots-gcs
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 10m
                memory: 10Mi
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      credentials:
        type: secret
        name: openbao-snapshots-gcp-sa
        advancedMounts:
          openbao-snapshots:
            upload:
              - path: /data/credentials/credentials.json
                subPath: credentials.json
                readOnly: true
