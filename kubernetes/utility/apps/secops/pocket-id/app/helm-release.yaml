---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pocket-id
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
    controllers:
      pocket-id:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          litestream-restore:
            image:
              repository: litestream/litestream
              tag: 0.5.18@sha256:513bff62a88fc0c86c73d27333c41c54c89fe890a7c32a551600adff9309b11b
            args:
              - restore
              - -if-db-not-exists
              - -if-replica-exists
              - /app/data/pocket-id.db
            envFrom:
              - secretRef:
                  name: pocket-id-litestream
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
          litestream:
            image:
              repository: litestream/litestream
              tag: 0.5.18@sha256:513bff62a88fc0c86c73d27333c41c54c89fe890a7c32a551600adff9309b11b
            args:
              - replicate
            restartPolicy: Always
            envFrom:
              - secretRef:
                  name: pocket-id-litestream
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
        containers:
          app:
            image:
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.19.2@sha256:3ee23895d6a3adb5dd5de801a4fd31fc31b960e6dfbea9b5200e33cf477695eb
            env:
              # https://pocket-id.org/docs/configuration/environment-variables
              TZ: Europe/Vienna
              ANALYTICS_DISABLED: "true"
              APP_URL: https://id.techtales.io
              EMAILS_VERIFIED: "true"
              FILE_BACKEND: database
              LOG_LEVEL: info
              LOG_JSON: "true"
              METRICS_ENABLED: "true"
              OTEL_METRICS_EXPORTER: prometheus
              OTEL_EXPORTER_PROMETHEUS_HOST: 0.0.0.0
              TRACING_ENABLED: "false"
            envFrom:
              - secretRef:
                  name: pocket-id-encryption
            ports:
              - name: http
                containerPort: &port 1411
              - name: metrics
                containerPort: &metricsPort 9464
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
        pod:
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
    service:
      app:
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    route:
      app:
        annotations:
          external-dns/unifi: "true"
        hostnames:
          - id.techtales.io
        parentRefs:
          - name: envoy
            namespace: networking
            sectionName: https
    persistence:
      backup:
        accessMode: ReadWriteOnce
        storageClass: nfs-truenas
        size: 10Gi
      data:
        type: emptyDir
        globalMounts:
          - path: /app/data
      litestream-config:
        type: configMap
        name: pocket-id-litestream-config
        advancedMounts:
          pocket-id:
            litestream:
              - path: /etc/litestream.yml
                subPath: litestream.yml
                readOnly: true
            litestream-restore:
              - path: /etc/litestream.yml
                subPath: litestream.yml
                readOnly: true
