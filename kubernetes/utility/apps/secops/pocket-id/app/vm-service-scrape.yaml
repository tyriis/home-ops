---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmservicescrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: pocket-id
spec:
  namespaceSelector:
    matchNames:
      - secops
  selector:
    matchLabels:
      app.kubernetes.io/instance: pocket-id
      app.kubernetes.io/name: pocket-id
      app.kubernetes.io/service: pocket-id
  endpoints:
    - port: metrics
      path: /metrics
      interval: 1m
