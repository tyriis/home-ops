---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: &name forgejo-db
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://cnpg/utility/forgejo/
    endpointURL: https://s3.techtales.io
    s3Credentials:
      accessKeyId:
        name: forgejo-db-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: forgejo-db-s3
        key: AWS_SECRET_ACCESS_KEY
