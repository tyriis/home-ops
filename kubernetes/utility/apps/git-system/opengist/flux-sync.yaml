---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app opengist
  annotations:
    backstage.io/discovery: enabled
    backstage.io/name: *app
spec:
  targetNamespace: &namespace git-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/volsync
  path: ./kubernetes/utility/apps/git-system/opengist/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: external-secrets-stores
      namespace: secops
    - name: envoy-gateway
      namespace: networking
    - name: volsync
      namespace: backup-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      CLUSTER: utility
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_STORAGECLASS: local-nvme
      VOLSYNC_SNAPSHOTCLASS: local-nvme
      VOLSYNC_CACHE_SNAPSHOTCLASS: local-nvme
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
