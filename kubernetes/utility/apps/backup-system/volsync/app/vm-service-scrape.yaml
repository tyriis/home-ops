---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmservicescrape_v1beta1.json
# job must stay "volsync-metrics": the live Prometheus job is named after the Service, not the Helm release.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: volsync-metrics
spec:
  namespaceSelector:
    matchNames:
      - backup-system
  selector:
    matchLabels:
      control-plane: volsync-controller
  endpoints:
    - port: https
      path: /metrics
      interval: 30s
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
