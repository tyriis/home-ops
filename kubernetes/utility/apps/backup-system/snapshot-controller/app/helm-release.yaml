---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  interval: 30m
  chart:
    spec:
      chart: snapshot-controller
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: piraeus
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controller:
      replicaCount: 1
      args:
        # Stamp VSCs with snapshot.storage.kubernetes.io/managed-by=<node> so the
        # node-side external-snapshotter sidecars (democratic-csi runs with
        # --node-deployment=true) pick up snapshots for locally provisioned PVCs.
        # See https://github.com/tyriis/home-ops/issues/10824
        enableDistributedSnapshotting: true
      serviceMonitor:
        create: true
