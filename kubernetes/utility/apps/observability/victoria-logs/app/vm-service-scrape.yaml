---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmservicescrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: victoria-logs
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app.kubernetes.io/instance: victoria-logs
      app.kubernetes.io/name: victoria-logs-single
      app.kubernetes.io/component: server
  endpoints:
    # Headless Service selects the server pod directly. Exposes vl_storage_* internals that
    # kubelet volume stats cannot — the local-hostpath PV reports the whole node filesystem.
    - port: http
      path: /metrics
      interval: 1m
