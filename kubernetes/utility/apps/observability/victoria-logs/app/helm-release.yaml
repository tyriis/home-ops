---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 30m
  timeout: 10m
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    server:
      retentionPeriod: 30d
      persistentVolume:
        size: 20Gi
        storageClassName: local-nvme
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
