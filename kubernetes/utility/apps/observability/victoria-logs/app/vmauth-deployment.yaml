---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmauth
  labels:
    app.kubernetes.io/name: vmauth
    app.kubernetes.io/component: proxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmauth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmauth
        app.kubernetes.io/component: proxy
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: vmauth
          image: docker.io/victoriametrics/vmauth:v1.153.0
          args:
            - -auth.config=/etc/vmauth/vmauth.yaml
            - -httpListenAddr=:8427
            - -configCheckInterval=1m
          env:
            - name: VMAUTH_TOKEN_MS01
              valueFrom:
                secretKeyRef:
                  name: vmauth-token-ms01
                  key: token
            - name: VMAUTH_TOKEN_UTILITY
              valueFrom:
                secretKeyRef:
                  name: vmauth-token-utility
                  key: token
            - name: VMAUTH_TOKEN_NAS
              valueFrom:
                secretKeyRef:
                  name: vmauth-token-nas
                  key: token
            - name: VMAUTH_TOKEN_BIFROST
              valueFrom:
                secretKeyRef:
                  name: vmauth-token-bifrost
                  key: token
            - name: VMAUTH_TOKEN_WORKSTATION
              valueFrom:
                secretKeyRef:
                  name: vmauth-token-workstation
                  key: token
            - name: VMAUTH_TOKEN_REMOTE
              valueFrom:
                secretKeyRef:
                  name: vmauth-token-remote
                  key: token
            - name: VMAUTH_TOKEN_GRAFANA
              valueFrom:
                secretKeyRef:
                  name: vmauth-token-grafana
                  key: token
          ports:
            - name: http
              containerPort: 8427
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8427
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8427
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vmauth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vmauth
