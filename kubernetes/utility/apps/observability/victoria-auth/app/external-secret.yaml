---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name vmauth-vmalert-credentials
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        VMAUTH_VMALERT_USER: "{{ .VMAUTH_VMALERT_USER }}"
        VMAUTH_VMALERT_PASS: "{{ .VMAUTH_VMALERT_PASS }}"
  dataFrom:
    - extract:
        key: infra/kubernetes/utility/observability/victoria-auth
