---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmauth-tokens
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: vmauth-tokens
    creationPolicy: Owner
  data:
    - secretKey: VMAUTH_TOKEN_MAIN
      remoteRef:
        key: infra/kubernetes/utility/observability/victoria-auth #gitleaks:allow
        property: VMAUTH_TOKEN_MAIN
    - secretKey: VMAUTH_TOKEN_UTILITY
      remoteRef:
        key: infra/kubernetes/utility/observability/victoria-auth #gitleaks:allow
        property: VMAUTH_TOKEN_UTILITY
    - secretKey: VMAUTH_TOKEN_NAS
      remoteRef:
        key: infra/kubernetes/utility/observability/victoria-auth #gitleaks:allow
        property: VMAUTH_TOKEN_NAS
    - secretKey: VMAUTH_TOKEN_BIFROST
      remoteRef:
        key: infra/kubernetes/utility/observability/victoria-auth #gitleaks:allow
        property: VMAUTH_TOKEN_BIFROST
    - secretKey: VMAUTH_TOKEN_RED
      remoteRef:
        key: infra/kubernetes/utility/observability/victoria-auth #gitleaks:allow
        property: VMAUTH_TOKEN_RED
    - secretKey: VMAUTH_TOKEN_PURPLE
      remoteRef:
        key: infra/kubernetes/utility/observability/victoria-auth #gitleaks:allow
        property: VMAUTH_TOKEN_PURPLE
    - secretKey: VMAUTH_TOKEN_SYNOLOGY
      remoteRef:
        key: infra/kubernetes/utility/observability/victoria-auth #gitleaks:allow
        property: VMAUTH_TOKEN_SYNOLOGY
    - secretKey: VMAUTH_TOKEN_GRAFANA
      remoteRef:
        key: infra/kubernetes/utility/observability/victoria-auth #gitleaks:allow
        property: VMAUTH_TOKEN_GRAFANA
