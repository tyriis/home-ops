---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmauth-tokens
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: vmauth-tokens
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        VMAUTH_TOKEN_MAIN: "{{ .VMAUTH_TOKEN_MAIN }}"
        VMAUTH_TOKEN_UTILITY: "{{ .VMAUTH_TOKEN_UTILITY }}"
        VMAUTH_TOKEN_NAS: "{{ .VMAUTH_TOKEN_NAS }}"
        VMAUTH_TOKEN_BIFROST: "{{ .VMAUTH_TOKEN_BIFROST }}"
        VMAUTH_TOKEN_RED: "{{ .VMAUTH_TOKEN_RED }}"
        VMAUTH_TOKEN_PURPLE: "{{ .VMAUTH_TOKEN_PURPLE }}"
        VMAUTH_TOKEN_SYNOLOGY: "{{ .VMAUTH_TOKEN_SYNOLOGY }}"
        VMAUTH_TOKEN_JARVIS: "{{ .VMAUTH_TOKEN_JARVIS }}"
        VMAUTH_TOKEN_GRAFANA: "{{ .VMAUTH_TOKEN_GRAFANA }}"
        VMAUTH_TOKEN_MAIN_METRICS: "{{ .VMAUTH_TOKEN_MAIN_METRICS }}"
        VMAUTH_TOKEN_UTILITY_METRICS: "{{ .VMAUTH_TOKEN_UTILITY_METRICS }}"
        VMAUTH_TOKEN_GRAFANA_METRICS: "{{ .VMAUTH_TOKEN_GRAFANA_METRICS }}"
        VMAUTH_TOKEN_VMALERT_METRICS: "{{ .VMAUTH_TOKEN_VMALERT_METRICS }}"
  dataFrom:
    - extract:
        key: infra/kubernetes/utility/observability/victoria-auth #gitleaks:allow
