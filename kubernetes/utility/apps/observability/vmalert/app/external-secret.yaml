---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmalert-datasource
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: vmalert-datasource
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .VMAUTH_TOKEN_VMALERT_METRICS }}"
  dataFrom:
    # Same Secret value vmauth validates against — do not rotate one without the other.
    # ClusterSecretStore policy only grants this cluster's tree; the main mirror at
    # infra/kubernetes/main/observability/victoria-metrics holds the identical token.
    - extract:
        key: infra/kubernetes/utility/observability/victoria-auth #gitleaks:allow
