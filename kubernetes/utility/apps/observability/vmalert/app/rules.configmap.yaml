---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
data:
  # LogsQL alert rules evaluated by vmalert against VictoriaLogs.
  # Grow these per-app over time, like prometheus-rule.yaml files elsewhere in the repo.
  # vmalert auto-appends `_time: <group interval>` to vlogs exprs, so rules must NOT
  # carry their own time filter (docs.victoriametrics.com/victorialogs/vmalert/#time-filter).
  rules.yaml: |
    groups:
      - name: log-error-rate
        type: vlogs
        interval: 5m
        rules:
          - alert: LogErrorRateHigh
            expr: 'level:in(ERROR, error) | stats by (cluster, kubernetes.pod_namespace, kubernetes.pod_name) count() as errors | filter errors:>100'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'High error log rate in {{ $labels.cluster }}: {{ index .Labels "kubernetes.pod_namespace" }}/{{ index .Labels "kubernetes.pod_name" }}'
              description: 'Pod {{ index .Labels "kubernetes.pod_name" }} in namespace {{ index .Labels "kubernetes.pod_namespace" }} of cluster {{ $labels.cluster }} logged more than 100 ERROR lines over the last 5 minutes ({{ $value }}).'

      - name: log-critical-fatal
        type: vlogs
        interval: 5m
        rules:
          - alert: CriticalLogDetected
            expr: 'level:in(CRITICAL, FATAL, critical, fatal) | stats by (cluster, kubernetes.pod_namespace, kubernetes.pod_name) count() as criticals | filter criticals:>0'
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'Critical/fatal log lines in {{ $labels.cluster }}: {{ index .Labels "kubernetes.pod_namespace" }}/{{ index .Labels "kubernetes.pod_name" }}'
              description: 'Pod {{ index .Labels "kubernetes.pod_name" }} in namespace {{ index .Labels "kubernetes.pod_namespace" }} of cluster {{ $labels.cluster }} logged CRITICAL or FATAL lines over the last 5 minutes ({{ $value }}).'

      - name: control-plane-log-signals
        type: vlogs
        interval: 5m
        rules:
          # Stale GC metadata informer in kube-controller-manager after a CRD
          # deletion: 404-reflector loop on the KCM leader only, ~30 lines/5m
          # at onset. Cosmetic; runbook covers detection, pre-check, restart.
          # Note: control-plane zap logs are structured — the reason lives in
          # the `err` field, _msg is only "Failed to watch"; dotted labels in
          # stats-by must be quoted; a LogsQL expr must NOT start with the
          # `filter` keyword (it is pipe-only; at lead position it becomes a
          # word-match for "filter" and silently returns zero rows).
          - alert: KCMStaleInformerLoop
            expr: 'kubernetes.container_name:"kube-controller-manager" "Failed to watch" | filter err:"could not find the requested resource" | stats by (cluster, kubernetes.pod_namespace, "kubernetes.pod_name") count() as stale | filter stale:>20'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'KCM stale informer loop in {{ $labels.cluster }}: {{ index .Labels "kubernetes.pod_name" }}'
              description: 'kube-controller-manager pod {{ index .Labels "kubernetes.pod_name" }} looped {{ $value }} "Failed to watch *v1.PartialObjectMetadata" lines over the last 5 minutes — a CRD was deleted while its GC informer was live. Cosmetic; restart of the affected pod clears it.'
              runbook_url: 'https://backstage.techtales.io/docs/default/System/main-cluster/runbooks/kcm-stale-informer-loop'

      - name: docker-host-crash-loop
        type: vlogs
        interval: 5m
        rules:
          # Docker hosts have no kube-state-metrics equivalent and restart-policy
          # loops never sit "unhealthy" long enough for Arcane auto-heal to see
          # them — the repeated startup abort IS the signal (live 2026-11-03:
          # hindsight crash-looped 1h45m on jarvis and agentix, 345 occurrences,
          # zero alerts). Text match is the uvicorn/FastAPI abort line; broaden
          # via extra OR terms in the lead filter, keep them abort-phrased —
          # generic "error"/"panic" word-matches flood the containers stream.
          - alert: ContainerStartupCrashLoop
            expr: '"Application startup failed" | stats by (hostname) count() as aborts | filter aborts:>2'
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'Crash-looping container on {{ $labels.hostname }}'
              description: 'A container on {{ $labels.hostname }} aborted startup {{ $value }} times in 5 minutes — the restart policy keeps re-feeding a fatal boot path. docker logs names the failure.'

      # Metrics rules against vmsingle, reached via the vmauth dual-engine route
      # (type: prometheus overrides --rule.defaultRuleType=vlogs).
      # Host scrapes run in vmagent on the docker hosts and reach VictoriaMetrics through remote
      # write; Prometheus never sees these series, so these alerts have no PrometheusRule twin.
      # Background: tyriis/home-ops#8376 and #11755 — a rotated minio scrape token had no alert.
      - name: host-scrape
        type: prometheus
        interval: 1m
        rules:
          # up == 0 while the rest of that host keeps reporting. For minio the usual cause is a
          # rejected bearer token, not a lost host: the scrape identity is prometheus-metrics and
          # a rotated secret breaks the token until 'mc admin prometheus generate' runs again.
          # Jobs absent from a host's config produce no series and therefore never fire here.
          # host!="" is load-bearing: utility's vmagent writes the same job names to this store;
          # only docker-host series carry a host label.
          - alert: HostScrapeFailing
            expr: 'up{job=~"doco-cd|minio|node-exporter|nvidia-gpu-exporter|smartctl-exporter|vlagent|vmagent", host!=""} == 0'
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: '{{ $labels.job }} on {{ $labels.host }} answers no scrape.'
              description: 'vmagent on {{ $labels.host }} has failed every scrape of {{ $labels.job }} at {{ $labels.instance }} for 10 minutes. A 403 on minio means the token no longer authorises admin:Prometheus; any other failure is the exporter itself.'
          # The floor case: no host writes at all, so up==0 cannot fire for anything.
          # Without host!="" the utility cluster's own jobs would keep this satisfied forever.
          - alert: HostScrapeFleetGone
            expr: 'absent(up{job=~"doco-cd|minio|node-exporter|nvidia-gpu-exporter|smartctl-exporter|vlagent|vmagent", host!=""})'
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: 'No docker host scrape target is up anywhere.'
              description: 'VictoriaMetrics holds no up series for any host job (doco-cd, minio, node-exporter, nvidia-gpu-exporter, smartctl-exporter, vlagent, vmagent), so no docker host is remote writing. That is the host fleet or the central write path, not one host.'
