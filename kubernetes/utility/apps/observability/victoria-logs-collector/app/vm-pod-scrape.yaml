---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmpodscrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: victoria-logs-collector
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app.kubernetes.io/instance: victoria-logs-collector
      app.kubernetes.io/name: victoria-logs-collector
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 1m
      relabelConfigs:
        # job must stay observability/victoria-logs-collector: dashboards and rules select it.
        - action: replace
          targetLabel: job
          replacement: observability/victoria-logs-collector
