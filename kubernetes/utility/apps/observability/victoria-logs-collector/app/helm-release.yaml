---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  interval: 30m
  timeout: 10m
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: victoria-logs-collector
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      tag: v1.53.0
    env:
      - name: VL_TOKEN
        valueFrom:
          secretKeyRef:
            name: vmauth-tokens
            key: VMAUTH_TOKEN_UTILITY
    remoteWrite:
      - url: >-
          http://vmauth.observability.svc.cluster.local:8427/insert/jsonline?_stream_fields=kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name&_msg_field=message
        format: jsonline
        maxDiskUsagePerURL: 1Gi
        headers:
          Authorization: Bearer %{VL_TOKEN}
    collector:
      extraFields: '{"cluster":"utility"}'
      excludeFilter: kubernetes.pod_name:=%{HOSTNAME}
    podAnnotations:
      reloader.stakater.com/auto: "true"
    podMonitor:
      enabled: true
      vm: false # utility runs kube-prometheus-stack, not VM-operator
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
