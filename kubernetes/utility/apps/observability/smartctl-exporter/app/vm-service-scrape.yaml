---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmservicescrape_v1beta1.json
# Selector omits app.kubernetes.io/version, helm.sh/chart and app.kubernetes.io/managed-by
# on purpose: they change on every chart bump and would silently stop matching.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: smartctl-exporter
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-smartctl-exporter
      app.kubernetes.io/instance: smartctl-exporter
  endpoints:
    - port: http
      path: /metrics
      interval: 1m
      scrapeTimeout: 30s
