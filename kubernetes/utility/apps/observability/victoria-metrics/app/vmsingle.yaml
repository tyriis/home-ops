---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmsingle_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: vmsingle
spec:
  retentionPeriod: 30d
  storage:
    storageClassName: local-nvme
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 50Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  extraArgs:
    search.maxConcurrentRequests: "16"
    search.maxQueueDuration: 30s
