---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmservicescrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: vmsingle
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app.kubernetes.io/instance: vmsingle
      app.kubernetes.io/name: vmsingle
      app.kubernetes.io/component: monitoring
  endpoints:
    # Only the http port: http-alias is the 8428->8429 duplicate of the same endpoint and would double every sample.
    # Self-referential by design: vmagent writes the result back into the store it is observing.
    # Exposes the storage internals (vm_fs_*, vm_free_disk_space_bytes, per-index row counts) that the
    # kubelet volume stats cannot — the local-hostpath PVs report the whole node filesystem, not the store.
    - port: http
      path: /metrics
      interval: 1m
