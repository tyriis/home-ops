---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmservicescrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: coredns
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      # The KPS-rendered metrics Service, not the coredns chart's own kube-dns Service (DNS ports only).
      app: kube-prometheus-stack-coredns
      release: kube-prometheus-stack
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 1m
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabelConfigs:
        # The Service is named kube-prometheus-stack-coredns; the live job is coredns.
        - action: replace
          targetLabel: job
          replacement: coredns
