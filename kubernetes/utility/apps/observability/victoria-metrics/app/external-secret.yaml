---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmagent-remote-write
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: vmagent-remote-write
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .VMAUTH_TOKEN_UTILITY_METRICS }}"
  dataFrom:
    # Same path vmauth reads; the token must match its utility-metrics user.
    - extract:
        key: infra/kubernetes/utility/observability/victoria-auth #gitleaks:allow
