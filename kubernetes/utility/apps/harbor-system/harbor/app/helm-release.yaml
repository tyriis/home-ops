---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: harbor
      version: 1.19.4
      sourceRef:
        kind: HelmRepository
        name: harbor
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # https://github.com/goharbor/harbor-helm
  values:
    externalURL: https://harbor.techtales.io
    persistence:
      persistentVolumeClaim:
        registry:
          storageClass: nfs-truenas
          size: 100Gi
        jobservice:
          jobLog:
            storageClass: nfs-truenas
        database:
          storageClass: local-nvme
        redis:
          storageClass: local-nvme
        trivy:
          storageClass: nfs-truenas
          size: 10Gi
    cache:
      enabled: true
    existingSecretAdminPassword: harbor-credentials #NOSONAR this is not a hardcoded secret, just the name of a k8s secret
    existingSecretAdminPasswordKey: password
    existingSecretSecretKey: harbor-encryption
