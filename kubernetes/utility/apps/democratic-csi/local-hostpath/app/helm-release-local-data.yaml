---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-data
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: democratic-csi
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    csiDriver:
      name: local-data.democratic-csi.home.arpa
      storageCapacity: true # With storage capacity tracking, the scheduler filters out nodes which do not have enough capacity.
      fsGroupPolicy: File # fsGroupChangePolicy

    storageClasses:
      - name: local-ssd
        defaultClass: false
        reclaimPolicy: Delete
        volumeBindingMode: WaitForFirstConsumer
        # distributed support is not yet ready for expansion
        allowVolumeExpansion: false
        # Hard scheduler gate: /var/mnt/data is a real disk only where a Talos
        # UserVolumeConfig `data` exists (talos/utility/patches/util02.patch.yaml;
        # today util02 alone). Widen ONLY when a node gains that volume — util01's
        # EVO volume is a separate change.
        allowedTopologies:
          - matchLabelExpressions:
              - key: kubernetes.io/hostname
                values:
                  - util02

    volumeSnapshotClasses:
      - name: local-ssd
        deletionPolicy: Delete
        parameters:
          cluster: ${FLUX_CLUSTER_NAME}

    controller:
      strategy: node
      # Talos root FS is read-only: kubelet cannot lazily create the hostPath
      # on nodes without the `data` UserVolumeConfig — the pod sticks in
      # ContainerCreating (mkdir ...: read-only file system, seen on util01
      # at the 2026-11-21 rollout). Pin the DS to nodes that HAVE the volume.
      # Widen ONLY together with the StorageClass allowedTopologies below.
      nodeSelector:
        kubernetes.io/hostname: util02
      externalProvisioner:
        extraArgs:
          - --leader-election=false
          - --node-deployment=true
          - --node-deployment-immediate-binding=false
          - --feature-gates=Topology=true
          - --strict-topology=true
          - --enable-capacity=true
          - --capacity-ownerref-level=1

      # distributed support is not yet ready
      externalResizer:
        enabled: false

      externalSnapshotter:
        extraArgs:
          - --leader-election=false
          - --node-deployment=true

    node:
      driver:
        extraVolumeMounts:
          - name: local-data
            mountPath: /var/mnt/data
            mountPropagation: Bidirectional

      # This hostPath resolves to the real disk only on nodes carrying the
      # UserVolumeConfig; elsewhere DirectoryOrCreate turns it into an OS-disk
      # directory. allowedTopologies on the StorageClass is the gate that
      # enforces this — without it a local-ssd PVC could land on the OS disk.
      extraVolumes:
        - name: local-data
          hostPath:
            path: /var/mnt/data
            type: DirectoryOrCreate

      # Same reason as controller.nodeSelector above — the DS only starts
      # where the hostPath is a real, Talos-managed mount.
      nodeSelector:
        kubernetes.io/hostname: util02

    driver:
      config:
        driver: local-hostpath
        instance_id: local-data
        local-hostpath:
          shareBasePath: /var/mnt/data
          controllerBasePath: /var/mnt/data
          dirPermissionsMode: "0770"
          dirPermissionsUser: 0
          dirPermissionsGroup: 0
