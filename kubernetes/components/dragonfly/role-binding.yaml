apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dragonfly-operator-write
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dragonfly-operator-write
subjects:
