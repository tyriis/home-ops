---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
#
# Opt-in override for the ExternalSecret contributed by
# components/envoy-pocketid: applied by the ten atlantis instances (via
# their kustomization patches:), never by either component itself.
#
# Not to be confused with this directory's external-secret.yaml, which
# belongs to the atlantis component and feeds the app's own env Secret.
#
# The ten atlantis hosts share ONE Pocket ID client, so this redirects the
# ${APP}-pocketid ExternalSecret from its default per-app path to a single
# shared key. Source of truth is techtales-io/terraform-pocket-id
# (pocketid/clients/atlantis), copied to this path as OAUTH_CLIENT_ID
# and OAUTH_CLIENT_SECRET.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-pocketid
spec:
  dataFrom:
    - extract:
        key: infra/kubernetes/main/atlantis-system/pocketid-oidc
