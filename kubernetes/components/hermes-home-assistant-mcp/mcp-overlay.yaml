---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${APP}-mcp-overlay
data:
  overlay.yaml: |
    # Per-instance Hermes MCP servers. Appended to the main Hermes config by the
    # init-config init container on every start.
    # NOTE: the Authorization value is dollar-escaped for the Flux postBuild
    # substitution pass; the running Hermes process expands the single-dollar
    # braced reference from the pod environment at startup.
    mcp_servers:
      home-assistant:
        url: "http://home-assistant-app.home-automation.svc.cluster.local:8123/api/mcp"
        headers:
          Authorization: "$${HA_TOKEN}"
        timeout: 180
        connect_timeout: 30
