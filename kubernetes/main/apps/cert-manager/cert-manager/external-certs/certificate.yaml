---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: unifi-techtales-io
spec:
  secretName: unifi-techtales-io-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: &domain unifi.techtales.io
  dnsNames:
    - *domain
