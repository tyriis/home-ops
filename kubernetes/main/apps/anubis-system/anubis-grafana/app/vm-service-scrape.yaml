---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmservicescrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: anubis-grafana
spec:
  namespaceSelector:
    matchNames:
      - anubis-system
  selector:
    matchLabels:
      app.kubernetes.io/name: anubis-grafana
      app.kubernetes.io/instance: anubis-grafana
  endpoints:
    - port: metrics
      scheme: http
      path: /metrics
      interval: 1m
