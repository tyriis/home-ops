---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cilium
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: 1.20.3
      sourceRef:
        kind: HelmRepository
        name: cilium
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # https://artifacthub.io/packages/helm/cilium/cilium?modal=values
    cluster:
      # literal per-cluster name (chart validate.yaml rejects unsubstituted
      # ${VAR} offline); matches clusterName in the talos machineconfig
      name: kube-lab
      id: 1
    k8sServiceHost: localhost
    k8sServicePort: 7445
    autoDirectNodeRoutes: true
    bandwidthManager:
      enabled: true
      bbr: true
    bpf:
      masquerade: true
      tproxy: true
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    # devices: bond+
    endpointRoutes:
      enabled: true
    gatewayAPI:
      enabled: false
      enableAlpn: true
      xffNumTrustedHops: 1
    hubble:
      # FIXME
      enabled: false
      metrics:
        enabled:
          - dns:query;ignoreAAAA
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - http
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          annotations:
            grafana_folder: Cilium
      relay:
        # FIXME
        enabled: false
      # ui:
      #   enabled: false
      #   rollOutPods: false
      #   ingress:
      #     enabled: true
      #     className: traefik
      #     annotations:
      #       cert-manager.io/cluster-issuer: letsencrypt-production
      #       kubernetes.io/tls-acme: "true"
      #       traefik.ingress.kubernetes.io/router.middlewares: traefik-ingress-sso@kubernetescrd
      #       traefik.ingress.kubernetes.io/router.entrypoints: websecure
      #       traefik.ingress.kubernetes.io/affinity: "true"
      #       traefik.ingress.kubernetes.io/router.tls: "true"
      #       external-dns/opnsense: "true"
      #       gethomepage.dev/enabled: "true"
      #       gethomepage.dev/description: Networking, Observability, and Security
      #       gethomepage.dev/group: Networking
      #       gethomepage.dev/icon: cilium
      #       gethomepage.dev/name: Hubble
      #       gethomepage.dev/weight: "10" # optional
      #     hosts:
      #       - &host hubble.techtales.io
      #     tls:
      #       - hosts:
      #           - *host
      #         secretName: hubble-tls
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 10.244.0.0/16
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: true
      # leaseDuration: 120s
      # leaseRenewDeadline: 60s
      # leaseRetryPeriod: 1s
    loadBalancer:
      algorithm: maglev
      mode: dsr
    localRedirectPolicies:
      enabled: true
    operator:
      replicas: 3
      rollOutPods: true
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
    dashboards:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        # flate renders without monitoring.coreos.com/v1 apiVersions; cilium's
        # validate.yaml then hard-requires this flag (deadvalues would call it
        # dead, hence the ignore entry in .deadvalues.yaml)
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      privileged: true
      # non-privileged mode: drop privileged and set these (chart 1.20.3 defaults
      # shown; they are DEAD while privileged=true). Requires bpffs pre-mounted
      # on every node -- a missing mount CrashLoops the CNI.
      # capabilities:
      #   ciliumAgent:
      #     - CHOWN
      #     - KILL
      #     - NET_ADMIN
      #     - NET_RAW
      #     - IPC_LOCK
      #     - SYS_ADMIN
      #     - SYS_RESOURCE
      #     - PERFMON
      #     - BPF
      #     - DAC_OVERRIDE
      #     - FOWNER
      #     - SETGID
      #     - SETUID
      #   cleanCiliumState:
      #     - NET_ADMIN
      #     - SYS_ADMIN
      #     - SYS_RESOURCE
