---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonarr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
    controllers:
      sonarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2800@sha256:89b57d1302099223e200c901d9127d085e43d6088f355b1b59869b9936cdaa10
            envFrom:
              - secretRef:
                  name: sonarr-env
            env:
              # https://wiki.servarr.com/useful-tools#using-environment-variables-for-config
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__APP__THEME: dark
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
              SONARR__LOG__ANALYTICSENABLED: "False"
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__PORT: &port 8989
              SONARR__UPDATE__BRANCH: develop
            ports:
              - name: http
                containerPort: *port
                protocol: TCP
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          external-dns/unifi: "true"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: TV Shows Collection Manager
          gethomepage.dev/group: Arr
          gethomepage.dev/icon: sonarr-dark
          gethomepage.dev/name: Sonarr
        hostnames:
          - &host "{{ .Release.Name }}.techtales.io"
        parentRefs:
          - name: envoy
            namespace: networking
            sectionName: https
    persistence:
      config:
        existingClaim: ${APP}-config
      media:
        type: nfs
        server: nas.techtales.io
        path: /mnt/tank/media
      logs:
        type: emptyDir
        medium: Memory
        sizeLimit: 128Mi # keep >= 2x Servarr log rotation default: 2 streams x 50 files x 1MB
        advancedMounts:
          sonarr:
            app:
              - path: /config/logs
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 32Mi
        advancedMounts:
          sonarr:
            app:
              - path: /tmp
      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        advancedMounts:
          sonarr:
            app:
              - path: /config/MediaCover
      backups:
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        advancedMounts:
          sonarr:
            app:
              - path: /config/Backups
      sentry:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        advancedMounts:
          sonarr:
            app:
              - path: /config/Sentry
