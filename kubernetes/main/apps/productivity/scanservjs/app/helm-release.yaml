---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app scanservjs
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # https://github.com/sbs20/scanservjs
  values:
    controllers:
      scanservjs:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: sbs20/scanservjs
              tag: 3.3.0@sha256:7a0c0dfd546f483c2fe8c5ccdcd8fc96301a41fb0d4309747fc8268108defb6a
            command: /bin/sh
            args: [-c, service dbus start && /entrypoint.sh]
            ports:
              - name: http
                containerPort: &port 8080
                protocol: TCP
            resources:
              requests:
                cpu: 10m
                memory: 301Mi
              # removed because of oom kill when scanning more pages
              # limits:
              #   memory: 250Mi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true

    service:
      app:
        controller: scanservjs
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          external-dns/unifi: "true"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Web UI frontend for your scanner
          gethomepage.dev/group: Productivity
          gethomepage.dev/icon: scanservjs
          gethomepage.dev/name: scanservjs
        hostnames:
          - "{{ .Release.Name }}.techtales.io"
        parentRefs:
          - name: envoy
            namespace: networking
            sectionName: https

    persistence:
      data:
        existingClaim: ${APP}-data
        advancedMounts:
          scanservjs:
            app:
              - path: /var/lib/scanservjs/output
      dbus:
        type: hostPath
        hostPath: /var/run/dbus
        advancedMounts:
          scanservjs:
            app:
              - path: /var/run/dbus
      airscan-config:
        type: configMap
        name: scanservjs-airscan-config
        advancedMounts:
          scanservjs:
            app:
              - path: /etc/sane.d/airscan.conf
                subPath: airscan.conf
                readOnly: true
