---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ${APP}-serve-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
  template:
    engineVersion: v2
    data:
      HERMES_DASHBOARD_OIDC_ISSUER: "https://id.techtales.io"
      HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .OAUTH_CLIENT_ID }}"
      HERMES_DASHBOARD_OIDC_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
      # The serve backend runs the agent runtime in-process, so it needs the
      # model provider key exactly like the `app` container. It is read from
      # the same OpenBao path the base ${APP}-secret already uses, so this
      # adds no new secret to store.
      TECHTALES_API_KEY: "{{ .TECHTALES_API_KEY }}"
  dataFrom:
    - extract:
        key: infra/kubernetes/main/hermes-agent/${APP}
