---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      hermes:
        forceRename: *app
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-config:
            image:
              repository: docker.io/library/alpine
              tag: 3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                cp /tmp/config.yaml /opt/data/config.yaml
                # Append the optional per-instance MCP overlay when mounted.
                # See kubernetes/components/hermes-home-assistant-mcp.
                if [ -f /tmp/mcp-overlay.yaml ]; then
                  printf '\n' >> /opt/data/config.yaml
                  cat /tmp/mcp-overlay.yaml >> /opt/data/config.yaml
                fi
                chown 10000:10000 /opt/data/config.yaml
          init-fix-ownership:
            image:
              repository: docker.io/library/alpine
              tag: 3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                # Migration: webui ran as root until now and left root-owned files
                # in the shared PVC. The gateway has always run as uid 10000, so
                # every root-owned entry under /opt/data was written by webui.
                # Only root-owned entries are selected (never a blind recursive
                # chown of the whole PVC), lost+found is left untouched, and
                # 10000-owned gateway data is not traversed.
                find /opt/data -mindepth 1 -maxdepth 1 -user 0 ! -name lost+found \
                  -print -exec chown -R 10000:10000 {} \;
                find /opt/data -mindepth 2 -maxdepth 2 -user 0 \
                  ! -path '/opt/data/lost+found/*' \
                  -print -exec chown -R 10000:10000 {} \;
                echo "ownership fix complete"
          init-agent-src:
            image:
              repository: ghcr.io/tyriis/hermes-agent
              tag: v2026.9.14@sha256:c62f33571ccc6b3165f937462a75496f357b27dc02cee99f400638fd748c6346
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                cp -r /opt/hermes/. /tmp/agent-src/
                chmod -R 755 /tmp/agent-src
                # The WebUI runs as uid 10000 and setuptools writes
                # hermes_agent.egg-info into the staged tree while building the
                # wheel, so the copy has to be writable by that uid. This is only
                # an ephemeral emptyDir.
                chown -R 10000:10000 /tmp/agent-src
                # Build-time stamp of the agent source, so the WebUI can tell when
                # the agent image changed. The emptyDir is repopulated on every
                # start, so this is derived from the image, not from the copy.
                printf '%s\n' "$(stat -c %Y /opt/hermes 2>/dev/null || echo unknown)" > /tmp/agent-src/.source-rev
        containers:
          app:
            command: ["hermes"]
            args: ["gateway", "run", "--no-supervise"]
            image: &image
              repository: ghcr.io/tyriis/hermes-agent
              tag: v2026.9.14@sha256:c62f33571ccc6b3165f937462a75496f357b27dc02cee99f400638fd748c6346
            ports:
              - name: api
                containerPort: 8642
                protocol: TCP
            env:
              S6_KEEP_ENV: "1"
              S6_READ_ONLY_ROOT: "1"
              API_SERVER_PORT: "8642"
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: "0.0.0.0"
              # API_SERVER_MODEL_NAME: "${APP}"
              HOME: &home /opt/data
              HERMES_HOME: *home
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_WRITE_SAFE_ROOT: /opt/data
              WIKI_PATH: /opt/data/wiki
              FIRECRAWL_API_URL: http://firecrawl-api.firecrawl-system.svc.cluster.local:3002 #NOSONAR allow http
              SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080 #NOSONAR allow http
            envFrom:
              - secretRef:
                  name: ${APP}-secret
            probes:
              liveness: &probes
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8642
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8642
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - SETUID
                  - SETGID
                  - CHOWN
                  - DAC_OVERRIDE
            resources: &resources
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
          webui:
            image:
              repository: ghcr.io/nesquena/hermes-webui
              tag: 0.52.319@sha256:20fb063b54bb795cdc37caea4f1d67bf283ce8a733b75cab21848dec6e05f6a1
            command: ["/bin/sh", "-c"]
            args:
              - |-
                set -e
                # Rebuild the virtualenv when the agent source or the WebUI
                # requirements change. Keying only on the venv's existence meant an
                # agent image bump never reached the WebUI's Python environment.
                # Keep shell variables UNBRACED here: the braced form is consumed by
                # the Flux postBuild substitution pass, which either blanks it or
                # fails the whole HelmRelease in strict mode.
                VENV=/opt/data/webui-venv
                REV="$(cat /tmp/agent-src/.source-rev 2>/dev/null || echo unknown)"
                REQ_REV="$(stat -c %Y /apptoo/requirements.txt 2>/dev/null || echo 0)"
                WANT="$REV:$REQ_REV"
                if [ ! -x "$VENV/bin/python3" ] || [ "$(cat "$VENV/.build-rev" 2>/dev/null)" != "$WANT" ]; then
                  echo "building webui venv ($WANT)"
                  rm -rf "$VENV"
                  uv venv "$VENV"
                  uv pip install --python "$VENV/bin/python" --no-cache -r /apptoo/requirements.txt
                  uv pip install --python "$VENV/bin/python" --no-cache /tmp/agent-src
                  printf '%s\n' "$WANT" > "$VENV/.build-rev"
                fi
                exec "$VENV/bin/python3" /apptoo/server.py
            ports:
              - name: webui
                containerPort: 8787
                protocol: TCP
            env:
              HERMES_WEBUI_HOST: "0.0.0.0"
              HERMES_WEBUI_PORT: "8787"
              HERMES_WEBUI_CHAT_BACKEND: gateway
              HERMES_WEBUI_GATEWAY_BASE_URL: http://localhost:8642
              HERMES_WEBUI_GATEWAY_USE_RUNS_API: "true"
              HERMES_WEBUI_AGENT_DIR: /tmp/agent-src
              HERMES_WEBUI_BOT_NAME: "${AGENT_NAME}"
              HERMES_WEBUI_PASSKEY: "1"
              HERMES_WEBUI_STATE_DIR: /opt/data/webui
              HERMES_NIX_BUILD: "1" # TODO: https://github.com/nesquena/hermes-webui/issues/6441
              HOME: *home
              HERMES_CONFIG_PATH: /opt/data/config.yaml
              HERMES_HOME: /opt/data
            envFrom:
              - secretRef:
                  name: ${APP}-secret
            probes:
              liveness: &webuiProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8787
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *webuiProbes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8787
                  initialDelaySeconds: 10
                  # The first start after an agent or WebUI image change rebuilds the
                  # virtualenv (venv create plus a full dependency install), which
                  # takes minutes. Keep a generous window so the kubelet cannot kill
                  # the build halfway and loop on it.
                  periodSeconds: 10
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 10000
              runAsGroup: 10000
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 320Mi
    service:
      app:
        forceRename: *app
        primary: true
        controller: hermes
        ports:
          api:
            port: 8642
          webui:
            port: 8787
            primary: true
    route:
      webui:
        annotations:
          external-dns/unifi: "true"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Hermes WebUI Chat
          gethomepage.dev/group: AI
          gethomepage.dev/icon: sh-hermes-agent-light
          gethomepage.dev/name: ${AGENT_NAME} agent
        hostnames:
          - "${AGENT_NAME}.techtales.io"
        parentRefs:
          - name: envoy
            namespace: networking
            sectionName: https
    persistence:
      configmap:
        type: configMap
        name: ${APP}-config
        defaultMode: 0755
        globalMounts:
          - path: /tmp/config.yaml
            subPath: config.yaml
      data:
        existingClaim: ${APP}-data
        advancedMounts:
          hermes:
            app:
              - path: *home
            init-config:
              - path: *home
            init-fix-ownership:
              - path: *home
            webui:
              - path: *home
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
            webui:
              - path: /run
      tmp:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /tmp
            webui:
              - path: /tmp
      agent-src:
        type: emptyDir
        advancedMounts:
          hermes:
            init-agent-src:
              - path: /tmp/agent-src
            webui:
              - path: /tmp/agent-src
