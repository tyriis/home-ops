---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      hermes:
        forceRename: *app
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-config:
            image:
              repository: docker.io/library/alpine
              tag: 3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                cp /tmp/config.yaml /opt/data/config.yaml
                chown 10000:10000 /opt/data/config.yaml
          init-agent-src:
            image:
              repository: ghcr.io/tyriis/hermes-agent
              tag: v2026.8.31@sha256:08d75fc06cbaf7d714b7273a7ca05f52add8f14126ba6e2b52986d9359414a6b
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                cp -r /opt/hermes/. /tmp/agent-src/
                chmod -R 755 /tmp/agent-src
        containers:
          app:
            command: ["hermes"]
            args: ["gateway", "run", "--no-supervise"]
            image: &image
              repository: ghcr.io/tyriis/hermes-agent
              tag: v2026.8.31@sha256:08d75fc06cbaf7d714b7273a7ca05f52add8f14126ba6e2b52986d9359414a6b
            ports:
              - name: api
                containerPort: 8642
                protocol: TCP
            env:
              S6_KEEP_ENV: "1"
              S6_READ_ONLY_ROOT: "1"
              API_SERVER_PORT: "8642"
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: "0.0.0.0"
              # API_SERVER_MODEL_NAME: "${APP}"
              HOME: &home /opt/data
              HERMES_HOME: *home
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_WRITE_SAFE_ROOT: /opt/data
              WIKI_PATH: /opt/data/wiki
              FIRECRAWL_API_URL: http://firecrawl-api.firecrawl-system.svc.cluster.local:3002 #NOSONAR allow http
            envFrom:
              - secretRef:
                  name: ${APP}-secret
            probes:
              liveness: &probes
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8642
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8642
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - SETUID
                  - SETGID
                  - CHOWN
                  - DAC_OVERRIDE
            resources: &resources
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
          webui:
            image:
              repository: ghcr.io/nesquena/hermes-webui
              tag: 0.52.264@sha256:1cbd42331e2046706230310e5fa0db537860536b87e7011630d4d4b6eebab2e2
            command: ["/bin/sh", "-c"]
            args:
              - test -d /opt/data/webui-venv || uv venv /opt/data/webui-venv && uv pip install --python /opt/data/webui-venv/bin/python --no-cache -r /apptoo/requirements.txt && uv pip install --python /opt/data/webui-venv/bin/python --no-cache /tmp/agent-src && /opt/data/webui-venv/bin/python3 /apptoo/server.py
            ports:
              - name: webui
                containerPort: 8787
                protocol: TCP
            env:
              HERMES_WEBUI_HOST: "0.0.0.0"
              HERMES_WEBUI_PORT: "8787"
              HERMES_WEBUI_CHAT_BACKEND: gateway
              HERMES_WEBUI_GATEWAY_BASE_URL: http://localhost:8642
              HERMES_WEBUI_AGENT_DIR: /tmp/agent-src
              HERMES_WEBUI_BOT_NAME: "${AGENT_NAME}"
              HERMES_WEBUI_PASSKEY: "1"
              HERMES_WEBUI_STATE_DIR: /opt/data/webui
              HERMES_NIX_BUILD: "1" # TODO: https://github.com/nesquena/hermes-webui/issues/6441
              HOME: *home
            envFrom:
              - secretRef:
                  name: ${APP}-secret
            probes:
              liveness: &webuiProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8787
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *webuiProbes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8787
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - DAC_OVERRIDE
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        forceRename: *app
        primary: true
        controller: hermes
        ports:
          api:
            port: 8642
          webui:
            port: 8787
            primary: true
    route:
      webui:
        annotations:
          external-dns/unifi: "true"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Hermes WebUI Chat
          gethomepage.dev/group: AI
          gethomepage.dev/icon: mdi-chat
          gethomepage.dev/name: Hermes WebUI
        hostnames:
          - "${AGENT_NAME}.techtales.io"
        parentRefs:
          - name: envoy
            namespace: networking
            sectionName: https
    persistence:
      configmap:
        type: configMap
        name: ${APP}-config
        defaultMode: 0755
        globalMounts:
          - path: /tmp/config.yaml
            subPath: config.yaml
      data:
        existingClaim: ${APP}-data
        advancedMounts:
          hermes:
            app:
              - path: *home
            init-config:
              - path: *home
            webui:
              - path: *home
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
            webui:
              - path: /run
      tmp:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /tmp
            webui:
              - path: /tmp
      agent-src:
        type: emptyDir
        advancedMounts:
          hermes:
            init-agent-src:
              - path: /tmp/agent-src
            webui:
              - path: /tmp/agent-src
