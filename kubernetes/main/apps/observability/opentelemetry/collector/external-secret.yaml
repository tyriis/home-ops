---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name otel-collector
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OTEL_BEARER_TOKEN: "{{ .OTEL_BEARER_TOKEN }}"
        # Metrics write token for vmauth in front of the central store. The
        # collector exports OTLP metrics with it to metrics.techtales.io
        # (vmauth user main-metrics). Kept on this cluster's own OpenBao path
        # because main has no read access to the utility paths; it must hold the
        # same value as VMAUTH_TOKEN_MAIN_METRICS in the utility vmauth path.
        VM_METRICS_TOKEN: "{{ .VM_METRICS_TOKEN }}"
  dataFrom:
    - extract:
        key: infra/kubernetes/main/observability/opentelemetry
