---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name otel-collector
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OTEL_BEARER_TOKEN: "{{ .OTEL_BEARER_TOKEN }}"
        VM_METRICS_TOKEN: "{{ .VM_METRICS_TOKEN }}"
  data:
    # Metrics write token. It lives on vmauth's own path in OpenBao (utility
    # cluster) next to the other vmauth tokens, so it is read from there instead
    # of duplicating the secret into the main-cluster opentelemetry path. ESO
    # merges data[] with the dataFrom extract below. The collector exports OTLP
    # metrics with it to metrics.techtales.io (vmauth user main-metrics).
    - secretKey: VM_METRICS_TOKEN
      remoteRef:
        key: infra/kubernetes/utility/observability/victoria-auth #gitleaks:allow
        property: VMAUTH_TOKEN_MAIN_METRICS
  dataFrom:
    - extract:
        key: infra/kubernetes/main/observability/opentelemetry
