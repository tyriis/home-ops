---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            auth:
              authenticator: bearertokenauth
          http:
            endpoint: 0.0.0.0:4318
            auth:
              authenticator: bearertokenauth
    processors:
      batch:
        send_batch_size: 1024
        timeout: 1s
      memory_limiter:
        check_interval: 5s
        limit_mib: 1024
    exporters:
      # otlphttp appends the signal path (/v1/metrics) to the base URL; do not repeat it.
      otlphttp/prom:
        endpoint: http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/otlp #NOSONAR allow http
        tls:
          insecure: true
      otlphttp/vm:
        endpoint: https://metrics.techtales.io/opentelemetry
        headers:
          Authorization: "Bearer ${env:VM_METRICS_TOKEN}"
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
    extensions:
      health_check: {}
      bearertokenauth:
        scheme: Bearer
        token: ${env:OTEL_BEARER_TOKEN}
    service:
      extensions: [health_check, bearertokenauth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/prom, otlphttp/vm]
        # logs pipeline removed with loki; OTLP ingestion to VictoriaLogs tracked in #10987
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
  env:
    - name: OTEL_BEARER_TOKEN
      valueFrom:
        secretKeyRef:
          name: otel-collector
          key: OTEL_BEARER_TOKEN
    - name: VM_METRICS_TOKEN
      valueFrom:
        secretKeyRef:
          name: otel-collector
          key: VM_METRICS_TOKEN
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
