---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
#
# NOTE: the kubernetes API server is NOT reachable via ipBlock egress rules under Cilium -
# ClusterIP traffic is DNAT'd before the policy verdict and node IPs carry the reserved
# kube-apiserver identity (excluded from CIDR matching by default). API egress is granted by the
# sibling CiliumNetworkPolicy opentelemetry-operator-apiserver (toEntities: kube-apiserver).
# Keep this NetworkPolicy for the egress default-deny posture + DNS allow; rules aggregate.
#
# ADOPTION WARNING: the live object for this policy was previously created out-of-band with an
# ownerReference pointing at the opentelemetry-operator Deployment and was not tracked by Flux.
# This manifest deliberately reuses the same name (and lands in the same namespace via the parent
# Kustomization targetNamespace: observability) so server-side apply takes over field ownership on
# first reconcile. The stale Deployment ownerReference may still trigger garbage collection if the
# Deployment is recreated; that may need kubectl patch adoption attention (removing/adjusting
# metadata.ownerReferences) on first reconcile.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opentelemetry-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: controller-manager
      app.kubernetes.io/name: opentelemetry-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Admission webhook
    - ports:
        - protocol: TCP
          port: 9443
    # Metrics
    - ports:
        - protocol: TCP
          port: 8443
  egress:
    # DNS resolution (CoreDNS in kube-system). API server egress lives in the
    # CiliumNetworkPolicy - ipBlock rules can never match it under Cilium.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
