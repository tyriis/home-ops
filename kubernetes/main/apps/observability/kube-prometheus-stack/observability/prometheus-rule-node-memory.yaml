---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: truenas-memory
spec:
  groups:
    - name: truenas-memory
      rules:
        - alert: TrueNasNodeMemoryHighUtilization
          annotations:
            description: Memory is filling up on {{ $labels.instance }}, has been above 90% for the last 15 minutes, is currently at {{ printf "%.2f" $value }}%. ZFS ARC is excluded from the calculation.
          expr: |
            100 - ((node_memory_MemAvailable_bytes{job="node-exporter", instance="nas.techtales.io:9100"} + node_zfs_arc_size{job="node-exporter", instance="nas.techtales.io:9100"}) / node_memory_MemTotal_bytes{job="node-exporter", instance="nas.techtales.io:9100"} * 100) > 90
          for: 15m
          labels:
            severity: warning
