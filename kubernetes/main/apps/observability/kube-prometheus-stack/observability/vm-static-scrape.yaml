---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmstaticscrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: truenas
  labels:
    app.kubernetes.io/name: truenas
spec:
  targetEndpoints:
    - targets:
        - nas.techtales.io:9100
      labels:
        job: node-exporter
        host: truenas
      scheme: http
      path: /metrics
      interval: 15s
    - targets:
        - nas.techtales.io:9633
      labels:
        job: smartctl-exporter
        host: truenas
      scheme: http
      path: /metrics
      interval: 15s
