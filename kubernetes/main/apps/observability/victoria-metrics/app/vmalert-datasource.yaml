---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmalert-datasource
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: vmalert-datasource
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Bearer token for the vmauth read user in front of the central store.
        token: "{{ .VMAUTH_TOKEN_VMALERT_METRICS }}"
  dataFrom:
    # Main's ClusterSecretStore policy only grants this cluster's own path, so
    # the vmauth read token is kept here as well as on the utility side. Both
    # copies must hold the SAME value: vmauth validates it, vmalert presents it.
    - extract:
        key: infra/kubernetes/main/observability/victoria-metrics #gitleaks:allow
