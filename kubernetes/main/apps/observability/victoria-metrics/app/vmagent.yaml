---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmagent_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: vmagent
spec:
  replicaCount: 1
  # Pick up every VMServiceScrape / VMStaticScrape / VMNodeScrape in the
  # cluster, matching the Prometheus setup (serviceMonitorSelectorNilUsesHelmValues: false).
  selectAllByDefault: true
  scrapeInterval: 1m
  scrapeTimeout: 30s
  externalLabels:
    cluster: main
  remoteWrite:
    - url: https://metrics.techtales.io/insert/prometheus/api/v1/write
      bearerTokenSecret:
        name: vmagent-remote-write
        key: token
  # statefulMode puts vmagent's persistent queue on a PVC instead of an emptyDir.
  # Samples buffered while the WAN link to the central store blips (or while the
  # pod is restarting) survive the disruption and are replayed afterwards.
  statefulMode: true
  statefulStorage:
    volumeClaimTemplate:
      spec:
        storageClassName: ceph-block
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
