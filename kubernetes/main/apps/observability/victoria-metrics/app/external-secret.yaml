---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmagent-remote-write
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: vmagent-remote-write
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The bearer token for VMAuth in front of the central VictoriaMetrics
        # store. Rendered from the OpenBao key below; never committed.
        token: "{{ .VMAUTH_TOKEN_MAIN_METRICS }}"
  dataFrom:
    # Main's ClusterSecretStore policy only grants this cluster's own path, so
    # the vmauth token is kept here as well as on the utility side. Both copies
    # must hold the SAME value: vmauth validates it, vmagent presents it.
    - extract:
        key: infra/kubernetes/main/observability/victoria-metrics #gitleaks:allow
