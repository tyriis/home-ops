---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmrule_v1beta1.json
# Ref: chart kube-prometheus-stack 92.13.1, PrometheusRule kube-prometheus-stack-node.rules
# Local change (2026-10-29): The node-exporter selectors in the memory-sum and the
# cpu-utilization rule add cluster!="". Off-cluster hosts (jarvis: host=jarvis, no
# cluster label) write to the central store. They add a label-less result series.
# vmalert then adds its external label cluster=main to that result, which equals
# the main sum. vmalert rejects the duplicate labelset and the rule writes
# nothing. The filter keeps those hosts out of the cluster sums. See
# https://docs.victoriametrics.com/victoriametrics/vmalert/#series-with-the-same-labelset
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kube-prometheus-stack-node.rules
spec:
  groups:
    - name: node.rules
      rules:
        - expr: |-
            topk by (cluster, namespace, pod) (1,
              max by (cluster, node, namespace, pod) (
                label_replace(kube_pod_info{job="kube-state-metrics",node!=""}, "pod", "$1", "pod", "(.*)")
            ))
          record: "node_namespace_pod:kube_pod_info:"
        - expr: |-
            count by (cluster, node) (
              node_cpu_seconds_total{mode="idle",job="node-exporter"}
              * on (cluster, namespace, pod) group_left(node)
              topk by (cluster, namespace, pod) (1, node_namespace_pod:kube_pod_info:)
            )
          record: node:node_num_cpu:sum
        - expr: |-
            sum(
              node_memory_MemAvailable_bytes{job="node-exporter",cluster!=""} or
              (
                node_memory_Buffers_bytes{job="node-exporter",cluster!=""} +
                node_memory_Cached_bytes{job="node-exporter",cluster!=""} +
                node_memory_MemFree_bytes{job="node-exporter",cluster!=""} +
                node_memory_Slab_bytes{job="node-exporter",cluster!=""}
              )
            ) by (cluster)
          record: :node_memory_MemAvailable_bytes:sum
        - expr: |-
            avg by (cluster, node) (
              sum without (mode) (
                rate(node_cpu_seconds_total{mode!="idle",mode!="iowait",mode!="steal",job="node-exporter",cluster!=""}[5m])
              )
            )
          record: node:node_cpu_utilization:ratio_rate5m
        - expr: |-
            avg by (cluster) (
              node:node_cpu_utilization:ratio_rate5m
            )
          record: cluster:node_cpu:ratio_rate5m
