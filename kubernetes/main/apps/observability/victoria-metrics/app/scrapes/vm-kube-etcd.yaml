---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmstaticscrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  # Job label "kube-etcd", matching the Prometheus job name.
  name: kube-etcd
spec:
  targetEndpoints:
    # etcd serves its metrics endpoint unauthenticated over plain HTTP.
    - targets:
        - 192.168.100.101:2381
        - 192.168.100.102:2381
        - 192.168.100.103:2381
      scheme: http
      path: /metrics
      interval: 1m
