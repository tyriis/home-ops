---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmstaticscrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: kube-controller-manager
spec:
  # Rules select job="kube-controller-manager"; the operator default is staticScrape/<ns>/<name>/<i>.
  jobName: kube-controller-manager
  targetEndpoints:
    - targets:
        - 192.168.100.101:10257
        - 192.168.100.102:10257
        - 192.168.100.103:10257
      scheme: https
      path: /metrics
      interval: 1m
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
