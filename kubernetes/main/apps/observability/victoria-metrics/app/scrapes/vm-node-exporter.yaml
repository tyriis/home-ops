---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmservicescrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  # Job label "node-exporter", same as the Prometheus ServiceMonitor job.
  name: node-exporter
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      # The kube-prometheus-stack subchart names the Service "node-exporter" but
      # labels it with the chart name. Verified against the live Service.
      app.kubernetes.io/name: prometheus-node-exporter
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 1m
      relabelConfigs:
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          regex: (.*)
          replacement: $1
          targetLabel: kubernetes_node
      metricRelabelConfigs:
        # Drop the useless ms-01 temperature sensors from chip="platform_nct6775_2592".
        - action: drop
          sourceLabels:
            - chip
            - sensor
          regex: platform_nct6775_2592;(temp1|temp3|temp4|temp5|temp6|temp8|temp9|temp10|temp11|temp12)
