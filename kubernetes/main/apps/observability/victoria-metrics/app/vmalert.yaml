---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmalert_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: vmalert
spec:
  replicaCount: 1
  evaluationInterval: 1m
  # ruleNamespaceSelector does not exist in this CRD version; leave it and ruleSelector unset.
  selectAllByDefault: true
  externalLabels:
    cluster: main
  datasource:
    url: https://metrics.techtales.io
    bearerTokenSecret:
      name: vmalert-datasource
      key: token
  # Recording rules require this; without it vmalert refuses to load any rules.
  # vmalert appends /api/v1/write itself; a full write URL here would double it.
  remoteWrite:
    url: https://metrics.techtales.io
    bearerTokenSecret:
      name: vmalert-remote-write
      key: token
  # No notifier while Prometheus still routes these alerts through Alertmanager; it would page twice.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
