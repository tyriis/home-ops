---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-dashboard
data:
  vmalert.json: |-
    {
      "title": "vmalert",
      "uid": "vmalert",
      "tags": ["observability", "vmalert", "utility"],
      "timezone": "browser",
      "editable": true,
      "refresh": "1m",
      "time": {"from": "now-6h", "to": "now"},
      "schemaVersion": 39,
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "VictoriaMetrics",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "panels": [
        {
          "type": "stat",
          "title": "Firing alerts",
          "id": 1,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 3, "x": 0, "y": 0},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "max(vmalert_alerts_firing{cluster=\"utility\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"type": "value", "options": {"0": {"text": "OK", "color": "green"}, "1": {"text": "FIRING", "color": "red"}}}
              ],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Pending alerts",
          "id": 2,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 3, "x": 3, "y": 0},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "max(vmalert_alerts_pending{cluster=\"utility\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"type": "value", "options": {"0": {"text": "OK", "color": "green"}, "1": {"text": "PENDING", "color": "orange"}}}
              ],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Notify errors 1h",
          "id": 3,
          "description": "Failed deliveries from vmalert to Alertmanager. Zero expected.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 3, "x": 6, "y": 0},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "sum(increase(vmalert_alerts_send_errors_total{cluster=\"utility\"}[1h]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Config reload",
          "id": 4,
          "description": "Last vmalert rules-file reload outcome across instances.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 3, "x": 9, "y": 0},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "min(vmalert_config_last_reload_successful{cluster=\"utility\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"type": "value", "options": {"0": {"text": "FAILED", "color": "red"}, "1": {"text": "OK", "color": "green"}}}
              ],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          }
        },
        {
          "type": "table",
          "title": "Alert state — live",
          "id": 5,
          "description": "Every vmalert alert rule with its live state. FIRING is delivered to the utility Alertmanager.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 4},
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "format": "table",
              "expr": "max by (group, alertname) (vmalert_alerts_firing{cluster=\"utility\"})"
            },
            {
              "refId": "B",
              "instant": true,
              "format": "table",
              "expr": "max by (group, alertname) (vmalert_alerts_pending{cluster=\"utility\"})"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {"byField": "alertname", "mode": "outer"}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true, "Time 1": true, "Time 2": true, "__name__": true},
                "renameByName": {"Value #A": "Firing", "Value #B": "Pending", "group": "Group", "alertname": "Alert"}
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {"align": "auto", "cellOptions": {"type": "color-text"}},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Firing"},
                "properties": [
                  {"id": "mappings", "value": [{"type": "value", "options": {"0": {"text": "inactive", "color": "green"}, "1": {"text": "FIRING", "color": "red"}}}]}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Pending"},
                "properties": [
                  {"id": "mappings", "value": [{"type": "value", "options": {"0": {"text": "-", "color": "green"}, "1": {"text": "pending", "color": "orange"}}}]}
                ]
              }
            ]
          }
        },
        {
          "type": "table",
          "title": "Rules — last evaluation samples",
          "id": 6,
          "description": "Series count returned by each rule's last evaluation. 1 means the expression matched log rows; for threshold rules the alert decision adds the filter step.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 13},
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "format": "table",
              "expr": "sum by (group, alertname) (vmalert_alerting_rules_last_evaluation_samples{cluster=\"utility\"})"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true},
                "renameByName": {"Value": "Samples", "group": "Group", "alertname": "Alert"}
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {"align": "auto", "cellOptions": {"type": "auto"}},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "blue", "value": 1}]}
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Rule evaluation errors (15m)",
          "id": 7,
          "description": "Query or execution failures per rule group. No data means healthy.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 22},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (group) (increase(vmalert_alerting_rules_errors_total{cluster=\"utility\"}[15m]))"
            },
            {
              "refId": "B",
              "expr": "sum by (group) (increase(vmalert_execution_errors_total{cluster=\"utility\"}[15m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {"drawStyle": "bars", "lineWidth": 1, "fillOpacity": 60},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}
            },
            "overrides": []
          }
        },
        {
          "type": "table",
          "title": "Group iterations (last 15m)",
          "id": 8,
          "description": "Evaluation cycles completed per rule group, last 15 minutes. Proves every group is still being evaluated. Recording groups at 1m intervals trend near 15; 5m alert groups near 3.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 30},
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "format": "table",
              "expr": "sum by (group) (increase(vmalert_iteration_total{cluster=\"utility\"}[15m]))"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true},
                "renameByName": {"Value": "Iterations", "group": "Group"}
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {"align": "auto", "cellOptions": {"type": "auto"}},
              "decimals": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}
            },
            "overrides": []
          }
        }
      ],
      "links": [
        {
          "title": "Utility Alertmanager",
          "type": "link",
          "url": "https://alertmanager.utility.techtales.io",
          "targetBlank": true
        }
      ]
    }
