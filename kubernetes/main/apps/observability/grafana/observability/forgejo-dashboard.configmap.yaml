---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-dashboard
data:
  forgejo.json: |-
    {
      "title": "Forgejo",
      "uid": "forgejo",
      "tags": ["forgejo", "utility"],
      "timezone": "browser",
      "editable": true,
      "refresh": "1m",
      "time": {"from": "now-6h", "to": "now"},
      "schemaVersion": 39,
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "panels": [
        {
          "type": "row",
          "title": "Overview",
          "id": 1,
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}
        },
        {
          "type": "stat",
          "title": "Repositories",
          "id": 2,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 1},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "gitea_repositories{cluster=\"utility\",job=\"git-system/forgejo\"}"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Users",
          "id": 3,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 1},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "gitea_users{cluster=\"utility\",job=\"git-system/forgejo\"}"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Organizations",
          "id": 4,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 1},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "gitea_organizations{cluster=\"utility\",job=\"git-system/forgejo\"}"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Open issues",
          "id": 5,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 4, "x": 12, "y": 1},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "gitea_issues_open{cluster=\"utility\",job=\"git-system/forgejo\"}"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Releases",
          "id": 6,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 4, "x": 16, "y": 1},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "gitea_releases{cluster=\"utility\",job=\"git-system/forgejo\"}"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Webhooks",
          "id": 7,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 4, "x": 20, "y": 1},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "gitea_webhooks{cluster=\"utility\",job=\"git-system/forgejo\"}"
            }
          ]
        },
        {
          "type": "row",
          "title": "Runtime",
          "id": 8,
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 5}
        },
        {
          "type": "timeseries",
          "title": "CPU",
          "id": 9,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 6},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "targets": [
            {
              "refId": "A",
              "legendFormat": "cores",
              "expr": "rate(process_cpu_seconds_total{cluster=\"utility\",job=\"git-system/forgejo\"}[5m])"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory",
          "id": 10,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 6},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "targets": [
            {
              "refId": "A",
              "legendFormat": "rss",
              "expr": "process_resident_memory_bytes{cluster=\"utility\",job=\"git-system/forgejo\"}"
            },
            {
              "refId": "B",
              "legendFormat": "virtual",
              "expr": "process_virtual_memory_bytes{cluster=\"utility\",job=\"git-system/forgejo\"}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Uptime",
          "id": 11,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 6},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "targets": [
            {
              "refId": "A",
              "legendFormat": "uptime",
              "expr": "time() - process_start_time_seconds{cluster=\"utility\",job=\"git-system/forgejo\"}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Goroutines",
          "id": 12,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 14},
          "targets": [
            {
              "refId": "A",
              "expr": "go_goroutines{cluster=\"utility\",job=\"git-system/forgejo\"}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "GC pause max",
          "id": 13,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 14},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "targets": [
            {
              "refId": "A",
              "legendFormat": "max",
              "expr": "go_gc_duration_seconds{cluster=\"utility\",job=\"git-system/forgejo\",quantile=\"1\"}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Open file descriptors",
          "id": 14,
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 14},
          "targets": [
            {
              "refId": "A",
              "expr": "process_open_fds{cluster=\"utility\",job=\"git-system/forgejo\"}"
            }
          ]
        }
      ]
    }
