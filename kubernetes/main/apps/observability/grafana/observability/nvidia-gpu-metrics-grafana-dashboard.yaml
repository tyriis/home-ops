---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
# Adapted from grafana.com/dashboards/14574 revision 18; same DS_PROMETHEUS pin as nvidia-gpu-overview.\n# uid vlvPlrgnk is the drill-down target of the Overview table rows.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: nvidia-gpu-metrics
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: victoriametrics
      inputName: DS_PROMETHEUS
  configMapRef:
    name: nvidia-gpu-metrics-dashboard
    key: dashboard.json
