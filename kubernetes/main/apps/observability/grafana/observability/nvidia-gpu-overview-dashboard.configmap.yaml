---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-gpu-overview-dashboard
data:
  dashboard.json: |-
    {
      "__inputs": [
        {
          "label": "VictoriaMetrics",
          "name": "DS_PROMETHEUS",
          "pluginId": "prometheus",
          "pluginName": "Prometheus",
          "type": "datasource"
        }
      ],
      "__requires": [
        {
          "id": "grafana",
          "name": "Grafana",
          "type": "grafana",
          "version": "11.2.0"
        },
        {
          "id": "prometheus",
          "name": "Prometheus",
          "type": "datasource",
          "version": "1.0.0"
        },
        {
          "id": "state-timeline",
          "name": "State timeline",
          "type": "panel",
          "version": ""
        },
        {
          "id": "table",
          "name": "Table",
          "type": "panel",
          "version": ""
        },
        {
          "id": "timeseries",
          "name": "Time series",
          "type": "panel",
          "version": ""
        }
      ],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Compare all GPUs of one node side by side: current state, utilization, thermals, throttling and health per GPU. Companion to the Nvidia GPU Metrics dashboard (single-GPU detail, click a GPU in the table to drill down). Shows physical GPUs as reported by nvidia-smi, MIG instances are not broken out: rows are the parent GPUs, whose utilization is not reported in MIG mode and shows n/a. Based on the prometheus metrics from github.com/utkuozdemir/nvidia_gpu_exporter",
      "editable": false,
      "fiscalYearStartMonth": 0,
      "gnetId": 25547,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [
            "nvidia_gpu_exporter"
          ],
          "targetBlank": false,
          "title": "Related dashboards",
          "tooltip": "",
          "type": "dashboards",
          "url": ""
        }
      ],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Every selected GPU on this node with its current state. Click a GPU name to open it in the single-GPU detail dashboard. Health columns show n/a when the driver does not report the metric.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false,
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "#"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 50
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "GPU"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open in GPU detail",
                        "url": "/d/vlvPlrgnk/nvidia-gpu-metrics?${job:queryparam}&${node:queryparam}&var-gpu=${__data.fields.uuid}&${__url_time_range}"
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 320
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "uuid"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Utilization"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "max",
                    "value": 1
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "basic",
                      "type": "gauge"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        }
                      ]
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "-1": {
                            "color": "#6E7B8B",
                            "index": 99,
                            "text": "n/a"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "match": "null",
                          "result": {
                            "color": "#6E7B8B",
                            "index": 100,
                            "text": "n/a"
                          }
                        },
                        "type": "special"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "VRAM Allocated"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "max",
                    "value": 1
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "basic",
                      "type": "gauge"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "purple",
                          "value": null
                        },
                        {
                          "color": "#F2CC0C",
                          "value": 0.85
                        },
                        {
                          "color": "#E02F44",
                          "value": 0.95
                        }
                      ]
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "-1": {
                            "color": "#6E7B8B",
                            "index": 99,
                            "text": "n/a"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "match": "null",
                          "result": {
                            "color": "#6E7B8B",
                            "index": 100,
                            "text": "n/a"
                          }
                        },
                        "type": "special"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Temperature"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "celsius"
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "max",
                    "value": 100
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "basic",
                      "type": "gauge"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#56A64B",
                          "value": null
                        },
                        {
                          "color": "#F2CC0C",
                          "value": 70
                        },
                        {
                          "color": "#E02F44",
                          "value": 80
                        }
                      ]
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "-1": {
                            "color": "#6E7B8B",
                            "index": 99,
                            "text": "n/a"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "match": "null",
                          "result": {
                            "color": "#6E7B8B",
                            "index": 100,
                            "text": "n/a"
                          }
                        },
                        "type": "special"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Power"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "max",
                    "value": 1
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "basic",
                      "type": "gauge"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "yellow",
                          "value": null
                        }
                      ]
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "-1": {
                            "color": "#6E7B8B",
                            "index": 99,
                            "text": "n/a"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "match": "null",
                          "result": {
                            "color": "#6E7B8B",
                            "index": 100,
                            "text": "n/a"
                          }
                        },
                        "type": "special"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "P-State"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "basic",
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "0": {
                            "color": "#2B62D9",
                            "index": 0,
                            "text": "P0 \u00b7 Max perf"
                          },
                          "1": {
                            "color": "#3469DB",
                            "index": 1,
                            "text": "P1"
                          },
                          "10": {
                            "color": "#88A9EB",
                            "index": 10,
                            "text": "P10"
                          },
                          "11": {
                            "color": "#91B0ED",
                            "index": 11,
                            "text": "P11"
                          },
                          "12": {
                            "color": "#9AB8EF",
                            "index": 12,
                            "text": "P12 \u00b7 Deep idle"
                          },
                          "13": {
                            "color": "#A3BFF0",
                            "index": 13,
                            "text": "P13"
                          },
                          "14": {
                            "color": "#ADC6F2",
                            "index": 14,
                            "text": "P14"
                          },
                          "15": {
                            "color": "#B6CDF4",
                            "index": 15,
                            "text": "P15 \u00b7 Min"
                          },
                          "2": {
                            "color": "#3E70DD",
                            "index": 2,
                            "text": "P2"
                          },
                          "3": {
                            "color": "#4777DE",
                            "index": 3,
                            "text": "P3"
                          },
                          "4": {
                            "color": "#507FE0",
                            "index": 4,
                            "text": "P4"
                          },
                          "5": {
                            "color": "#5986E2",
                            "index": 5,
                            "text": "P5"
                          },
                          "6": {
                            "color": "#638DE4",
                            "index": 6,
                            "text": "P6"
                          },
                          "7": {
                            "color": "#6C94E6",
                            "index": 7,
                            "text": "P7"
                          },
                          "8": {
                            "color": "#759BE7",
                            "index": 8,
                            "text": "P8 \u00b7 Idle"
                          },
                          "9": {
                            "color": "#7EA2E9",
                            "index": 9,
                            "text": "P9"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "-1": {
                            "color": "#6E7B8B",
                            "index": 99,
                            "text": "n/a"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "match": "null",
                          "result": {
                            "color": "#6E7B8B",
                            "index": 100,
                            "text": "n/a"
                          }
                        },
                        "type": "special"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Throttling"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "basic",
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "0": {
                            "color": "#56A64B",
                            "index": 0,
                            "text": "None"
                          },
                          "1": {
                            "color": "#FFB357",
                            "index": 1,
                            "text": "1 reason active"
                          },
                          "2": {
                            "color": "#FF9830",
                            "index": 2,
                            "text": "2 reasons active"
                          },
                          "3": {
                            "color": "#E02F44",
                            "index": 3,
                            "text": "3 reasons active"
                          },
                          "4": {
                            "color": "#C4162A",
                            "index": 4,
                            "text": "4 reasons active"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "match": "null",
                          "result": {
                            "color": "#6E7B8B",
                            "index": 100,
                            "text": "n/a"
                          }
                        },
                        "type": "special"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "ECC Errors"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "basic",
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "0": {
                            "color": "#56A64B",
                            "index": 0,
                            "text": "None"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "-1": {
                            "color": "#6E7B8B",
                            "index": 99,
                            "text": "No ECC"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "match": "null",
                          "result": {
                            "color": "#6E7B8B",
                            "index": 100,
                            "text": "No ECC"
                          }
                        },
                        "type": "special"
                      }
                    ]
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#6E7B8B",
                          "value": null
                        },
                        {
                          "color": "#E02F44",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Recovery Action"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "basic",
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "0": {
                            "color": "#56A64B",
                            "index": 0,
                            "text": "Healthy"
                          },
                          "1": {
                            "color": "#FF9830",
                            "index": 1,
                            "text": "GPU Reset"
                          },
                          "2": {
                            "color": "#C4162A",
                            "index": 2,
                            "text": "Node Reboot"
                          },
                          "3": {
                            "color": "#F2CC0C",
                            "index": 3,
                            "text": "Drain P2P"
                          },
                          "4": {
                            "color": "#E02F44",
                            "index": 4,
                            "text": "Drain & Reset"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "-1": {
                            "color": "#6E7B8B",
                            "index": 99,
                            "text": "Not reported"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "match": "null",
                          "result": {
                            "color": "#6E7B8B",
                            "index": 100,
                            "text": "Not reported"
                          }
                        },
                        "type": "special"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "#"
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "label_join(label_replace(label_join(nvidia_smi_gpu_info{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}, \"ni\", \" #\", \"name\", \"index\"), \"us\", \"($1)\", \"uuid\", \"^(........).*\"), \"gpu_label\", \" \", \"ni\", \"us\")",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "(nvidia_smi_utilization_gpu_ratio{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) or (sum by(uuid, instance, job) (nvidia_smi_gpu_info{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0 - 1)",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "(nvidia_smi_memory_used_bytes{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"} / nvidia_smi_memory_total_bytes{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) or (sum by(uuid, instance, job) (nvidia_smi_gpu_info{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0 - 1)",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "(nvidia_smi_temperature_gpu{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) or (sum by(uuid, instance, job) (nvidia_smi_gpu_info{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0 - 1)",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "(nvidia_smi_power_draw_watts{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"} / ((nvidia_smi_enforced_power_limit_watts{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"} or nvidia_smi_power_limit_watts{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"} or nvidia_smi_power_default_limit_watts{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) > 0)) or (sum by(uuid, instance, job) (nvidia_smi_gpu_info{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0 - 1)",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "E"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "(nvidia_smi_pstate{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) or (sum by(uuid, instance, job) (nvidia_smi_gpu_info{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0 - 1)",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "F"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "(sum by(uuid, instance, job) (nvidia_smi_clocks_event_reasons_sw_power_cap{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"} or nvidia_smi_clocks_throttle_reasons_sw_power_cap{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) or (sum by(uuid, instance, job) (nvidia_smi_gpu_info{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0)) + (sum by(uuid, instance, job) (nvidia_smi_clocks_event_reasons_sw_thermal_slowdown{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"} or nvidia_smi_clocks_throttle_reasons_sw_thermal_slowdown{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) or (sum by(uuid, instance, job) (nvidia_smi_gpu_info{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0)) + (sum by(uuid, instance, job) (nvidia_smi_clocks_event_reasons_hw_thermal_slowdown{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"} or nvidia_smi_clocks_throttle_reasons_hw_thermal_slowdown{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) or (sum by(uuid, instance, job) (nvidia_smi_gpu_info{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0)) + (sum by(uuid, instance, job) (nvidia_smi_clocks_event_reasons_hw_power_brake_slowdown{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"} or nvidia_smi_clocks_throttle_reasons_hw_power_brake_slowdown{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) or (sum by(uuid, instance, job) (nvidia_smi_gpu_info{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0))",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "G"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "(sum by(uuid, instance, job) (nvidia_smi_ecc_errors_uncorrected_aggregate_total{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) or sum by(uuid, instance, job) ({__name__=~\"nvidia_smi_ecc_errors_uncorrected_aggregate_.+\", uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"})) or (sum by(uuid, instance, job) (nvidia_smi_gpu_info{uuid=~\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0 - 1)",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "H"
            },
            {
              "datasource": {
                "type": "prometheus",
