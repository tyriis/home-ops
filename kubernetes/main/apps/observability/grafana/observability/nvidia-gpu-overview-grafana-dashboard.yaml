---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
# Adapted from grafana.com/dashboards/25547 revision 6 (utkuozdemir/nvidia_gpu_exporter): the interactive\n# datasource dropdown is replaced by the DS_PROMETHEUS input mapped to victoriametrics - host series only\n# reach the central store. uid kept upstream so the drill-down into nvidia-gpu-metrics resolves.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: nvidia-gpu-overview
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: victoriametrics
      inputName: DS_PROMETHEUS
  configMapRef:
    name: nvidia-gpu-overview-dashboard
    key: dashboard.json
