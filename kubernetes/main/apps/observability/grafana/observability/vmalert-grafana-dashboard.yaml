---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
# Live state of the utility-cluster vmalert engine: alert rule states, per-evaluation
# samples, and delivery health. vmalert evaluates the vlogs rules; alerts land in
# the utility Alertmanager, which Grafana does not render — this dashboard is the window.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: vmalert
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: victoriametrics
      inputName: DS_PROMETHEUS
  configMapRef:
    name: vmalert-dashboard
    key: vmalert.json
