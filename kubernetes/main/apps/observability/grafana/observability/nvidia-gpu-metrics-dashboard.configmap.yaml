---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-gpu-metrics-dashboard
data:
  dashboard.json: |-
    {
      "__elements": {},
      "__inputs": [
        {
          "label": "VictoriaMetrics",
          "name": "DS_PROMETHEUS",
          "pluginId": "prometheus",
          "pluginName": "Prometheus",
          "type": "datasource"
        }
      ],
      "__requires": [
        {
          "id": "gauge",
          "name": "Gauge",
          "type": "panel",
          "version": ""
        },
        {
          "id": "grafana",
          "name": "Grafana",
          "type": "grafana",
          "version": "11.2.0"
        },
        {
          "id": "prometheus",
          "name": "Prometheus",
          "type": "datasource",
          "version": "1.0.0"
        },
        {
          "id": "stat",
          "name": "Stat",
          "type": "panel",
          "version": ""
        },
        {
          "id": "state-timeline",
          "name": "State timeline",
          "type": "panel",
          "version": ""
        },
        {
          "id": "table",
          "name": "Table",
          "type": "panel",
          "version": ""
        },
        {
          "id": "timeseries",
          "name": "Time series",
          "type": "panel",
          "version": ""
        }
      ],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Nvidia GPU Metrics based on the prometheus metrics from github.com/utkuozdemir/nvidia_gpu_exporter",
      "editable": false,
      "fiscalYearStartMonth": 0,
      "gnetId": 14574,
      "graphTooltip": 0,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [
            "nvidia_gpu_exporter"
          ],
          "targetBlank": false,
          "title": "Related dashboards",
          "tooltip": "",
          "type": "dashboards",
          "url": ""
        }
      ],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Recovery action the driver recommends for this GPU. Healthy means none. Color reflects how disruptive the action is: Drain P2P degrades peer-to-peer but keeps computing, GPU Reset interrupts workloads, Node Reboot and Drain & Reset are the heaviest. Requires a recent driver, older drivers do not report this.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "text",
                "mode": "fixed"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "#56A64B",
                      "index": 0,
                      "text": "Healthy"
                    },
                    "1": {
                      "color": "#FF9830",
                      "index": 1,
                      "text": "GPU Reset"
                    },
                    "2": {
                      "color": "#C4162A",
                      "index": 2,
                      "text": "Node Reboot"
                    },
                    "3": {
                      "color": "#F2CC0C",
                      "index": 3,
                      "text": "Drain P2P"
                    },
                    "4": {
                      "color": "#E02F44",
                      "index": 4,
                      "text": "Drain & Reset"
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "Not reported by driver",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": ""
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "id": 35,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "text": {},
            "textMode": "value",
            "wideLayout": true
          },
          "pluginVersion": "11.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "nvidia_smi_gpu_recovery_action{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}",
              "instant": false,
              "legendFormat": "__auto",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Recovery Action",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Number of performance-limiting throttle reasons currently active: power cap, SW/HW thermal slowdown, HW power brake. Idle and configuration states (application clocks, sync boost) are not counted, and a flag the driver does not report counts as inactive. See the Throttle Reasons history panel for which reason and when.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "text",
                "mode": "fixed"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "#56A64B",
                      "index": 0,
                      "text": "None"
                    },
                    "1": {
                      "color": "#FFB357",
                      "index": 1,
                      "text": "1 reason active"
                    },
                    "2": {
                      "color": "#FF9830",
                      "index": 2,
                      "text": "2 reasons active"
                    },
                    "3": {
                      "color": "#E02F44",
                      "index": 3,
                      "text": "3 reasons active"
                    },
                    "4": {
                      "color": "#C4162A",
                      "index": 4,
                      "text": "4 reasons active"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": ""
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "id": 40,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "text": {},
            "textMode": "value",
            "wideLayout": true
          },
          "pluginVersion": "11.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "(sum by(uuid) (nvidia_smi_clocks_event_reasons_sw_power_cap{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"} or nvidia_smi_clocks_throttle_reasons_sw_power_cap{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}) or (sum by(uuid) (nvidia_smi_gpu_info{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0)) + (sum by(uuid) (nvidia_smi_clocks_event_reasons_sw_thermal_slowdown{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"} or nvidia_smi_clocks_throttle_reasons_sw_thermal_slowdown{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}) or (sum by(uuid) (nvidia_smi_gpu_info{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0)) + (sum by(uuid) (nvidia_smi_clocks_event_reasons_hw_thermal_slowdown{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"} or nvidia_smi_clocks_throttle_reasons_hw_thermal_slowdown{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}) or (sum by(uuid) (nvidia_smi_gpu_info{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0)) + (sum by(uuid) (nvidia_smi_clocks_event_reasons_hw_power_brake_slowdown{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"} or nvidia_smi_clocks_throttle_reasons_hw_power_brake_slowdown{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}) or (sum by(uuid) (nvidia_smi_gpu_info{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Throttling",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Lifetime uncorrected ECC error count. Uses the aggregate total when the driver reports one, otherwise the sum of all reported aggregate uncorrected counters (some GPUs report subcounters without a total). Any value above zero means the GPU memory has produced uncorrectable errors and the card needs attention. Shows 'No ECC reported' when the driver reports no uncorrected-error counters at all (most GeForce cards).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "text",
                "mode": "fixed"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "#56A64B",
                      "index": 0,
                      "text": "None"
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "No ECC reported",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6E7B8B",
                    "value": null
                  },
                  {
                    "color": "#E02F44",
                    "value": 1
                  }
                ]
              },
              "unit": ""
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "id": 41,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "text": {},
            "textMode": "value",
            "wideLayout": true
          },
          "pluginVersion": "11.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum by(uuid) (nvidia_smi_ecc_errors_uncorrected_aggregate_total{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}) or sum by(uuid) ({__name__=~\"nvidia_smi_ecc_errors_uncorrected_aggregate_.+\", uuid=\"$gpu\", instance=\"$node\", job=\"$job\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "ECC Errors (uncorrected)",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 3
          },
          "id": 49,
          "panels": [],
          "title": "Overview",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Current performance state, P0 (maximum performance) to P15 (minimum). Lower P means busier. Vivid blue = working hard, pale blue = idle. This is operational state, not a health signal.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "text",
                "mode": "fixed"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "#2B62D9",
                      "index": 0,
                      "text": "P0 \u00b7 Max perf"
                    },
                    "1": {
                      "color": "#3469DB",
                      "index": 1,
                      "text": "P1"
                    },
                    "10": {
                      "color": "#88A9EB",
                      "index": 10,
                      "text": "P10"
                    },
                    "11": {
                      "color": "#91B0ED",
                      "index": 11,
                      "text": "P11"
                    },
                    "12": {
                      "color": "#9AB8EF",
                      "index": 12,
                      "text": "P12 \u00b7 Deep idle"
                    },
                    "13": {
                      "color": "#A3BFF0",
                      "index": 13,
                      "text": "P13"
                    },
                    "14": {
                      "color": "#ADC6F2",
                      "index": 14,
                      "text": "P14"
                    },
                    "15": {
                      "color": "#B6CDF4",
                      "index": 15,
                      "text": "P15 \u00b7 Min"
                    },
                    "2": {
                      "color": "#3E70DD",
                      "index": 2,
                      "text": "P2"
                    },
                    "3": {
                      "color": "#4777DE",
                      "index": 3,
                      "text": "P3"
                    },
                    "4": {
                      "color": "#507FE0",
                      "index": 4,
                      "text": "P4"
                    },
                    "5": {
                      "color": "#5986E2",
                      "index": 5,
                      "text": "P5"
                    },
                    "6": {
                      "color": "#638DE4",
                      "index": 6,
                      "text": "P6"
                    },
                    "7": {
                      "color": "#6C94E6",
                      "index": 7,
                      "text": "P7"
                    },
                    "8": {
                      "color": "#759BE7",
                      "index": 8,
                      "text": "P8 \u00b7 Idle"
                    },
                    "9": {
                      "color": "#7EA2E9",
                      "index": 9,
                      "text": "P9"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": ""
            },
            "overrides": []
          },
          "gridPos": {
            "h": 2,
            "w": 6,
            "x": 0,
            "y": 4
          },
          "id": 22,
          "options": {
            "colorMode": "background_solid",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "text": {
              "valueSize": 20
            },
            "textMode": "value",
            "wideLayout": true
          },
          "pluginVersion": "11.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "exemplar": true,
              "expr": "nvidia_smi_pstate{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}",
              "interval": "",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "P-State",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Static identity of the selected GPU as reported by the driver.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "text",
                "mode": "fixed"
              },
              "custom": {
                "align": "left",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false,
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Field"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 95
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "#8A94A6",
                      "mode": "fixed"
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 0,
            "y": 6
          },
          "id": 42,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": false
          },
          "pluginVersion": "11.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "nvidia_smi_gpu_info{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "GPU Info",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Value": true,
                  "__name__": true,
                  "driver_model_current": true,
                  "driver_model_pending": true,
                  "index": true,
                  "instance": true,
                  "job": true,
                  "pci_sub_device_id": true,
                  "serial": true,
                  "uuid": true
                },
                "indexByName": {
                  "Time": 0,
                  "compute_cap": 5,
                  "cuda_version": 3,
                  "driver_version": 2,
                  "name": 1,
                  "pci_bus_id": 6,
                  "vbios_version": 4
                },
                "renameByName": {
                  "compute_cap": "Compute Cap",
                  "cuda_version": "CUDA",
                  "driver_version": "Driver",
                  "name": "GPU",
                  "pci_bus_id": "PCI Bus",
                  "vbios_version": "VBIOS"
                }
              }
            },
            {
              "id": "transpose",
              "options": {}
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Compute mode is a configuration, not a health state.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "text",
                "mode": "fixed"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "#5B7A9D",
                      "index": 0,
                      "text": "Default"
                    },
                    "1": {
                      "color": "#8A5CD1",
                      "index": 1,
                      "text": "Exclusive Thread"
                    },
                    "2": {
                      "color": "#B455A0",
                      "index": 2,
                      "text": "Prohibited"
                    },
                    "3": {
                      "color": "#3E9E9E",
                      "index": 3,
                      "text": "Exclusive Process"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": ""
            },
            "overrides": []
          },
          "gridPos": {
            "h": 2,
            "w": 6,
            "x": 0,
            "y": 13
          },
          "id": 36,
          "options": {
            "colorMode": "background_solid",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "text": {
              "valueSize": 20
            },
            "textMode": "value",
            "wideLayout": true
          },
          "pluginVersion": "11.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "nvidia_smi_compute_mode{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}",
              "instant": false,
              "legendFormat": "__auto",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Compute Mode",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Percent of time over the past sample period during which one or more kernels was executing on the GPU.\nThe sample period may be between 1 second and 1/6 second depending on the product. MIG-enabled cards do not report a whole-GPU number, which shows as N/A; per-instance activity is in the MIG panels.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "-1": {
                      "color": "#6E7B8B",
                      "index": 0,
                      "text": "N/A"
                    }
                  },
                  "type": "value"
                }
              ],
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 6,
            "y": 4
          },
          "id": 6,
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "sizing": "auto",
            "text": {}
          },
          "pluginVersion": "11.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "exemplar": true,
              "expr": "sum(nvidia_smi_utilization_gpu_ratio{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}) or sum(nvidia_smi_gpu_info{uuid=\"$gpu\", instance=\"$node\", job=\"$job\"}) * 0 - 1",
              "interval": "",
              "legendFormat": "{{uuid}}",
              "refId": "A"
            }
          ],
          "title": "GPU Util",
          "type": "gauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Board power draw as a share of the power limit in force: the enforced limit when the driver reports one, otherwise the software or default limit.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "yellow",
                    "value": null
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 9,
            "y": 4
          },
          "id": 21,
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
