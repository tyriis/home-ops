---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name grafana-env
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .GF_AUTH_GENERIC_OAUTH_CLIENT_ID }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET }}"
        VMAUTH_TOKEN_GRAFANA: "{{ .VMAUTH_TOKEN_GRAFANA }}"
        VMAUTH_AUTHORIZATION: "Bearer {{ .VMAUTH_TOKEN_GRAFANA }}"
        VMAUTH_METRICS_AUTHORIZATION: "Bearer {{ .VMAUTH_TOKEN_GRAFANA_METRICS }}"
  data:
    # Metrics read token. It lives on vmauth's own path in OpenBao (utility
    # cluster) next to the other vmauth tokens, so it is read from there instead
    # of duplicating the secret into the main-cluster grafana path. ESO merges
    # data[] with the dataFrom extract below.
    - secretKey: VMAUTH_TOKEN_GRAFANA_METRICS
      remoteRef:
        key: infra/kubernetes/utility/observability/victoria-auth #gitleaks:allow
        property: VMAUTH_TOKEN_GRAFANA_METRICS
  dataFrom:
    - extract:
        key: infra/kubernetes/main/observability/grafana #gitleaks:allow

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name grafana-admin
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GF_SECURITY_ADMIN_USER: "{{ .USERNAME }}"
        GF_SECURITY_ADMIN_PASSWORD: "{{ .PASSWORD }}"
  dataFrom:
    - extract:
        key: infra/kubernetes/main/observability/grafana #gitleaks:allow
