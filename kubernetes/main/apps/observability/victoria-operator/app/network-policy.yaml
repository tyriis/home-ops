---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victoria-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8080
    # kube-apiserver calls the webhook from the host network; no `from` selector can match it.
    - ports:
        - protocol: TCP
          port: 9443
