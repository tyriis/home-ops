---
web:
  port: ${WEB_PORT}
storage:
  type: sqlite
  path: /config/sqlite.db
  caching: true
metrics: true
debug: false
ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/108371159
  link: https://github.com/techtales-io
  buttons:
    - name: Tyriis
      link: https://github.com/tyriis
    - name: Jazzlyn
      link: https://github.com/jazzlyn
    - name: home-ops
      link: https://github.com/tyriis/home-ops
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m
endpoints:
  - name: flux-webhook-utility
    group: external
    url: https://flux-webhook-utility.techtales.io
    interval: 1m
    ui:
      hide-hostname: true
      hide-url: true
    client:
      dns-resolver: tcp://192.168.1.1:53
    conditions:
      - "[STATUS] == 404"
  - name: forgejo
    group: internal
    url: https://git.techtales.io/api/healthz
    interval: 5m
    client:
      dns-resolver: tcp://192.168.1.1:53
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-url: true
  - name: locking-service
    group: internal
    url: http://locking-service.home-automation.svc.cluster.local:3000/health
    interval: 1m
    ui:
      hide-hostname: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"
  - name: blackbox-exporter
    group: internal
    url: http://blackbox-exporter.observability.svc.cluster.local:9115
    interval: 1m
    ui:
      hide-hostname: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"
  - name: immich-machine-learning
    group: internal
    url: http://immich-machine-learning.media.svc.cluster.local:3003/ping
    interval: 1m
    ui:
      hide-hostname: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"
  # infrastructure
  - name: FRITZ!Box
    group: infrastructure
    url: http://192.168.178.1
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-hostname: true
      hide-url: true
  - name: Unifi
    group: infrastructure
    url: http://unifi.techtales.io
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-hostname: false
      hide-url: false
  - name: TrueNAS
    group: infrastructure
    url: https://nas.techtales.io
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-hostname: false
      hide-url: false
  - name: Synology
    group: infrastructure
    url: https://synology.techtales.io
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-hostname: false
      hide-url: false
  - name: silo
    group: infrastructure
    url: https://minio.techtales.io
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-hostname: false
      hide-url: false
  - name: karakeep-meilisearch
    group: internal
    url: http://karakeep-meilisearch.productivity.svc.cluster.local:7700/health
    interval: 1m
    ui:
      hide-hostname: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"
  - name: OpenBAO
    group: infrastructure
    url: https://secrets.techtales.io/ui/
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-hostname: false
      hide-url: false
  # Docker-host routes. Several of these answer 401/403/302 by design (API auth, S3 root,
  # login redirects), so the check asserts the route is alive rather than a specific page:
  # a 502/503 from Traefik, a DNS failure or a bad certificate all fail it, an auth
  # challenge passes. Hence "< 500" rather than "== 200".
  # --- bifrost ---
  - name: arcane
    group: internal
    url: https://arcane.techtales.io
    interval: 1m
    conditions:
      - "[STATUS] < 500"
    ui:
      hide-hostname: true
      hide-url: true
  - name: techtales-ai
    group: infrastructure
    url: https://techtales.ai
    interval: 1m
    conditions:
      - "[STATUS] < 500"
    ui:
      hide-hostname: false
      hide-url: false
  # --- truenas ---
  - name: olah
    group: internal
    url: https://hf.techtales.io
    interval: 1m
    conditions:
      - "[STATUS] < 500"
    ui:
      hide-hostname: false
      hide-url: true
  - name: s3
    group: infrastructure
    url: https://s3.techtales.io
    interval: 1m
    conditions:
      - "[STATUS] < 500"
    ui:
      hide-hostname: false
      hide-url: false
  # jarvis routes (openchamber, hermes-jarvis, jarvis-a2a) are absent on purpose: they
  # live on 192.168.30.100 and nothing in the cluster has yet proven a route to that
  # subnet. Add them once reachability is confirmed, or they read as a broken host.
