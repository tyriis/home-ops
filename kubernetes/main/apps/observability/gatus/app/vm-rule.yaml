---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: gatus-rules
spec:
  groups:
    - name: gatus.rules
      rules:
        - alert: GatusEndpointDown
          annotations:
            summary: The {{ $labels.name }} endpoint is down.
          expr: |-
            gatus_results_endpoint_success == 0
          for: 5m
          labels:
            severity: critical
