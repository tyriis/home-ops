---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmservicescrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: speedtest-exporter
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app.kubernetes.io/name: speedtest-exporter
      app.kubernetes.io/instance: speedtest-exporter
  endpoints:
    - port: metrics
      scheme: http
      interval: 60m
      scrapeTimeout: 1m
      path: /metrics
