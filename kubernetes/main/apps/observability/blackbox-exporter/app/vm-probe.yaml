  name: ping-cloudflare
spec:
  jobName: ping-cloudflare
  interval: 30s
  scrapeTimeout: 30s
  module: icmp
  vmProberSpec:
    url: http://blackbox-exporter.observability.svc.cluster.local:9115
    path: /probe
  targets:
    static:
      targets:
        - 1.1.1.1
  honorTimestamps: true
  metricRelabelConfigs:
    - action: replace
      targetLabel: instance
      replacement: 1.1.1.1
    - action: replace
      targetLabel: target
