---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  interval: 30m
  timeout: 10m
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: victoria-logs-collector
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      tag: v1.53.0
    env:
      - name: VL_TOKEN
        valueFrom:
          secretKeyRef:
            name: victoria-logs-collector
            key: VL_TOKEN
    remoteWrite:
      # Central VictoriaLogs through vmauth. Two vlagent constraints, learned
      # the hard way on the utility rollout (PRs #10989, #10990):
      # 1. Commas must be percent-encoded: vlagent splits -remoteWrite.url on
      #    raw commas and fails with "unsupported scheme" on the fragments.
      # 2. maxDiskUsagePerURL accepts VM-style sizes (GB) but not k8s
      #    quantities (Gi); quoted so the chart renders the value verbatim.
      - url: >-
          https://logs.techtales.io/insert/jsonline?_stream_fields=kubernetes.pod_namespace%2Ckubernetes.pod_name%2Ckubernetes.container_name&_msg_field=message
        format: jsonline
        maxDiskUsagePerURL: "1GB"
        headers:
          Authorization: Bearer ***
    collector:
      extraFields: '{"cluster":"main"}'
      excludeFilter: kubernetes.pod_name:=%{HOSTNAME}
    podAnnotations:
      reloader.stakater.com/auto: "true"
    podMonitor:
      enabled: true
      vm: false # main runs kube-prometheus-stack, not VM-operator
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      # 242 pods on 3 nodes: the pod-metadata cache plus log buffers OOM the
      # 256Mi utility-cluster sizing here (utility runs 64 pods, 114Mi used).
      limits:
        memory: 512Mi
