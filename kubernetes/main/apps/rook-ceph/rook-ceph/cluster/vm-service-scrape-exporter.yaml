---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmservicescrape_v1beta1.json
# Native replacement for the ServiceMonitor the rook-ceph-operator creates at runtime
# while CephCluster.spec.monitoring.enabled is true
# (pkg/operator/ceph/cluster/nodedaemon/exporter.go, EnableCephExporterServiceMonitor).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: rook-ceph-exporter
spec:
  namespaceSelector:
    matchNames:
      - rook-ceph
  selector:
    matchLabels:
      app: rook-ceph-exporter
      rook_cluster: rook-ceph
  endpoints:
    - port: ceph-exporter-http-metrics
      path: /metrics
      interval: 30s
      honorLabels: true
