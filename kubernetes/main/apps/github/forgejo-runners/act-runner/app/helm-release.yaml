---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      act-runner:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          runner:
            image:
              repository: code.forgejo.org/forgejo/runner
              tag: v13.1.0
            command:
              - /bin/sh
              - -c
            args:
              - /usr/local/bin/act_runner daemon --config /config/config.yaml
            resources: &resources
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 2Gi
            securityContext:
              privileged: true
          docker-daemon:
            image:
              repository: docker.io/library/docker
              tag: 28-dind
            env:
              DOCKER_HOST: unix:///var/run/docker.sock
              DOCKER_TLS_CERTDIR: ""
            resources: *resources
            securityContext:
              privileged: true
    persistence:
      config:
        type: secret
        name: ${APP}-config
        advancedMounts:
          act-runner:
            runner:
              - path: /config
                readOnly: true
      run-dir:
        type: emptyDir
        advancedMounts:
          act-runner:
            runner:
              - path: /run
                mountPropagation: HostToContainer
            docker-daemon:
              - path: /run
