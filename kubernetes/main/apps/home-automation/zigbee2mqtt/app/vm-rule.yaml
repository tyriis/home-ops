---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: zigbee2mqtt-rules
spec:
  groups:
    - name: zigbee2mqtt.rules
      rules:
        - alert: DeviceNotSeen
          annotations:
            summary: Zigbee Device {{ $labels.device }} on {{ $labels.job }} has not been seen since 24h.
          expr: |-
            zigbee2mqtt_last_seen{device!~"hue.*|tradfri ambience spot.*|ambient desk.*"} > (60 * 60 * 24)
          for: 10m
          labels:
            severity: warning
