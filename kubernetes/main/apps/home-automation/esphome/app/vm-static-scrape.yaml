---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmstaticscrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: esphome
spec:
  targetEndpoints:
    - targets:
        - 192.168.10.60:80
      labels:
        job: sensor-heating
      path: /metrics
      scheme: http
      interval: 15s
    - targets:
        - 192.168.10.61:80
      labels:
        job: sensor-bathroom
      path: /metrics
      scheme: http
      interval: 15s
    - targets:
        - 192.168.10.62:80
      labels:
        job: light-stairs
      path: /metrics
      scheme: http
      interval: 15s
    - targets:
        - 192.168.10.63:80
      labels:
        job: switch-livingroom
      path: /metrics
      scheme: http
      interval: 15s
    - targets:
        - 192.168.10.64:80
      labels:
        job: switch-domiroom
      path: /metrics
      scheme: http
      interval: 15s
    - targets:
        - 192.168.10.65:80
      labels:
        job: bt-proxy-office
      path: /metrics
      scheme: http
      interval: 15s
    - targets:
        - 192.168.10.65:80
      labels:
        job: bt-proxy-diningroom
      path: /metrics
      scheme: http
      interval: 15s
