---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name influxdb3-env
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY }}"
        AWS_SECRET_ACCESS_KEY: "{{ .S3_SECRET_KEY }}"
        INFLUXDB3_BUCKET: "{{ .S3_BUCKET_NAME }}"
        INFLUXDB3_LICENSE_TYPE: home
        INFLUXDB3_LICENSE_EMAIL: "{{ .LICENSE_EMAIL }}"
        # envFrom skips this key (invalid env name) with a warning; only the file mount uses it
        admin-token.json: '{"token":"{{ .ADMIN_TOKEN }}","name":"_admin"}'
  dataFrom:
    - extract:
        key: infra/kubernetes/main/influxdb/influxdb3 #gitleaks:allow
