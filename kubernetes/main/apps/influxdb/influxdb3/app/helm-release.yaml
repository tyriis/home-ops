---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app influxdb3
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      influxdb3:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1500
            runAsGroup: 1500
            fsGroup: 1500
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: docker.io/library/influxdb
              tag: 3.12.2-enterprise@sha256:77f4ede92700f19194b1816162aecba015ead1efe70673549af5e5d5ec57a48c
            args:
              - serve
              - --node-id=influxdb3-node0
              - --cluster-id=influxdb3
              - --object-store=s3
              - --aws-endpoint=https://s3.techtales.io
              - --aws-default-region=us-east-1
              - --data-dir=/var/lib/influxdb3
              - --http-bind=0.0.0.0:8181
              - --admin-token-file=/etc/influxdb3/admin-token.json
              - --disable-authz=health
            envFrom:
              - secretRef:
                  name: influxdb3-env
            ports:
              - name: http
                containerPort: &port 8181
                protocol: TCP
            probes:
              readiness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 6
              liveness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 2
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: influxdb3
        globalMounts:
          - path: /var/lib/influxdb3
      plugins:
        type: emptyDir
      tmp:
        type: emptyDir
      admin-token:
        type: secret
        name: influxdb3-env
        globalMounts:
          - path: /etc/influxdb3/admin-token.json
            subPath: admin-token.json
            readOnly: true
