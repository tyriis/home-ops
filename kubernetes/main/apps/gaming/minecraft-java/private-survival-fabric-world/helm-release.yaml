---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  uninstall:
    keepHistory: false
  # https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      minecraft:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/itzg/minecraft-server
              tag: 2026.10.1@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  initialDelaySeconds: 30
                  periodSeconds: 5
                  exec: &mc-health { command: ["mc-health"] }
                  failureThreshold: 20
              readiness: *probes
              startup:
                <<: *probes
                spec:
                  initialDelaySeconds: 30
                  periodSeconds: 1
                  failureThreshold: 300
                  exec: *mc-health
            envFrom:
              - secretRef:
                  name: ${APP}-rcon
              - secretRef:
                  name: ${APP}-curseforge-api-key
              - configMapRef:
                  name: ${APP}-env
            env:
              # https://docker-minecraft-server.readthedocs.io/en/latest/variables
              TYPE: FABRIC
              # pinned by hand: no renovate datasource for the Minecraft version
              VERSION: 26.3

              MEMORY: 4096M
              JVM_XX_OPTS: "-XX:+UseZGC -XX:+AlwaysPreTouch"
              MODS_FILE: /config/plugins.txt
              REPLACE_ENV_DURING_SYNC: true
              FABRIC_PROXY_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-proxy-forwarding
                    key: forwarding.secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            ports:
              - name: java
                containerPort: 25565
              - name: rcon
                containerPort: 25575
              - name: metrics
                containerPort: 25585

            resources:
              requests:
                cpu: 500m
                memory: 4000Mi

    service:
      minecraft:
        ports:
          java:
            port: 25565
          metrics:
            port: 25585
      rcon:
        ports:
          rcon:
            port: 25575

    serviceMonitor:
      metrics:
        serviceName: ${APP}-minecraft
        endpoints:
          - port: metrics
            scheme: http
            path: /
            interval: 1m

    persistence:
      data:
        existingClaim: ${APP}-data
      config:
        type: configMap
        name: ${APP}-config
        globalMounts:
          - path: /config/plugins.txt
            subPath: plugins.txt
            readOnly: true
      universal-graves:
        type: configMap
        name: minecraft-survival-fabric-world-plugins-universal-graves-config
        globalMounts:
          - path: /config/universal-graves/config.json
            subPath: config.json
            readOnly: true
