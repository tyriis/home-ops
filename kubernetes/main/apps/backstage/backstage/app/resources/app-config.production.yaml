---
app:
  baseUrl: ${BASE_URL}
  title: TechTales Backstage

# Pocket-ID OIDC. The provider module is compiled into the image, and the app
# shows its sign-in button whenever this block is present (guest is used when
# it is not).
auth:
  environment: production
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    oidc:
      production:
        metadataUrl: https://id.techtales.io/.well-known/openid-configuration
        clientId: ${AUTH_OIDC_CLIENT_ID}
        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        prompt: auto
        # No signIn.resolvers: the cluster image registers a fixed sign-in
        # resolver (email local part -> user entity) in its backend module;
        # declarative resolvers must stay unset for that provider to init.

# Sign in with a full-page redirect instead of the auth popup. The popup flow
# against Pocket-ID fails with `login_required`; the redirect flow reaches the
# Pocket-ID sign-in page and completes.
enableExperimentalRedirectFlow: true

# Local builder: /opt/techdocs-venv (mkdocs + mkdocs-techdocs-core) ships in the image.
techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local
    local:
      publishDirectory: /var/backstage-data/techdocs

backend:
  baseUrl: ${BASE_URL}
  listen: ":7007"
  cors:
    origin: ${BASE_URL}
  csp:
    connect-src: ["'self'", "http:", "https:"]
    img-src: ["'self'", "data:", "https:"]
  # SQLite on the data PVC: catalog survives pod restarts; a lost PVC just re-ingests.
  database:
    client: better-sqlite3
    connection:
      directory: /var/backstage-data/db
  reading:
    allow:
      - host: raw.githubusercontent.com
        path: /tyriis/locking-service/main/openapi.yaml

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, User, Group, Domain]
  locations:
    - type: url
      target: https://github.com/tyriis/home-ops/blob/main/docs/backstage/catalog-info.yaml
    - type: url
      target: https://github.com/techtales-io/backstage-docs/blob/main/knowledge/catalog-info.yaml
    # User entities live outside this repo, in a private Forgejo instance.
    - type: url
      target: https://git.techtales.io/jarvis/backstage-users/src/branch/main/catalog-info.yaml

# Forgejo integration: the instance requires sign-in, so Backstage reads the
# users catalog with a read-only API token.
integrations:
  gitea:
    - host: git.techtales.io
      password: ${FORGEJO_TOKEN}
