---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # https://github.com/bjw-s-labs/helm-charts/tree/main/charts/other/app-template
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      backstage:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          dynamic-plugins:
            image:
              repository: quay.io/rhdh-community/rhdh
              tag: 1.10.5@sha256:ef7b9c8278e3ec2fb329ae1bb889bcce274411c7681e38e9e1743ef8a3e8b0f3
            workingDir: /opt/app-root/src
            command:
              - ./install-dynamic-plugins.sh
            args:
              - /dynamic-plugins-root
        containers:
          app:
            image:
              repository: quay.io/rhdh-community/rhdh
              tag: 1.10.5@sha256:ef7b9c8278e3ec2fb329ae1bb889bcce274411c7681e38e9e1743ef8a3e8b0f3
            # RHDH entrypoint is exec-form: these append after its own --config flags and win.
            args:
              - --config
              - /opt/app-root/src/dynamic-plugins-root/app-config.dynamic-plugins.yaml
              - --config
              - /app-config/app-config.production.yaml
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /.backstage/health/v1/liveness
                    port: &port 7007
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /.backstage/health/v1/readiness
                    port: 7007
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /.backstage/health/v1/liveness
                    port: 7007
                  periodSeconds: 5
                  failureThreshold: 24
            envFrom:
              - secretRef:
                  name: backstage-secrets

    service:
      app:
        controller: backstage
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          external-dns/unifi: "true"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Internal Developer Portal
          gethomepage.dev/group: Development
          gethomepage.dev/icon: si-backstage
          gethomepage.dev/name: Backstage
        hostnames:
          - "{{ .Release.Name }}.techtales.io"
        parentRefs:
          - name: envoy
            namespace: networking
            sectionName: https

    persistence:
      config:
        type: configMap
        name: app-config
        advancedMounts:
          backstage:
            dynamic-plugins:
              - path: /opt/app-root/src/dynamic-plugins.yaml
                subPath: dynamic-plugins.yaml
                readOnly: true
            app:
              - path: /app-config
                readOnly: true
      dynamic-plugins:
        type: emptyDir
        advancedMounts:
          backstage:
            dynamic-plugins:
              - path: /dynamic-plugins-root
            app:
              - path: /opt/app-root/src/dynamic-plugins-root
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        size: 5Gi
        globalMounts:
          - path: /var/backstage-data
