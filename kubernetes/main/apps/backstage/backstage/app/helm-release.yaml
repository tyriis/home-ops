---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # https://github.com/bjw-s-labs/helm-charts/tree/main/charts/other/app-template
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      backstage:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: harbor.techtales.io/main/techtales/backstage
              tag: v0.1.0@sha256:4b831f3a15e631ece35f762fdc8af9fac474b35047ed173b3844c8bc1b508372
            # app-config.yaml is baked into the image (plugin, search and TechDocs
            # defaults); the mounted ConfigMap supplies the deployment values on top.
            args:
              - --config
              - app-config.yaml
              - --config
              - /app-config/app-config.production.yaml
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /.backstage/health/v1/liveness
                    port: &port 7007
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /.backstage/health/v1/readiness
                    port: 7007
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /.backstage/health/v1/liveness
                    port: 7007
                  periodSeconds: 5
                  failureThreshold: 24
            envFrom:
              - secretRef:
                  name: backstage-secrets

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          external-dns/unifi: "true"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Internal Developer Portal
          gethomepage.dev/group: Development
          gethomepage.dev/icon: si-backstage
          gethomepage.dev/name: Backstage
        hostnames:
          - "{{ .Release.Name }}.techtales.io"
        parentRefs:
          - name: envoy
            namespace: networking
            sectionName: https

    persistence:
      config:
        type: configMap
        name: app-config
        advancedMounts:
          backstage:
            app:
              - path: /app-config
                readOnly: true
      data:
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        size: 5Gi
        globalMounts:
          - path: /var/backstage-data
