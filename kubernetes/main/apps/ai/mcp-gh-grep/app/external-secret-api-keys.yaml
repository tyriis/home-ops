---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mcp-gh-grep-api-keys
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      # every key here becomes an Envoy API-key client id; credentials only
      data:
        shared: "{{ .MCP_API_KEY }}"
  dataFrom:
    - extract:
        key: infra/kubernetes/main/ai/mcp-gh-grep
