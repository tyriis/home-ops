---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/role_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: toolhive-operator-events
rules:
  # The chart grants only events.k8s.io/events, so the operator cannot record core v1 events
  # ("events is forbidden" at startup). This restores them for the ai namespace only.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: toolhive-operator-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: toolhive-operator-events
subjects:
  - kind: ServiceAccount
    name: toolhive-operator
    namespace: ai
