---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-context7
  annotations:
    external-dns/unifi: "true"
    gatus.home-operations.com/endpoint: |
      url: https://mcp-context7.techtales.io/
      conditions:
        - "[STATUS] == 401"
spec:
  hostnames:
    - mcp-context7.techtales.io
  parentRefs:
    - name: envoy
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - name: mcp-context7-remote-proxy
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
