---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: mcpservers.toolhive.stacklok.dev/v1beta1
kind: McpServer
metadata:
  name: unifi-network-mcp
spec:
  image: ghcr.io/sirkirby/unifi-network-mcp:0.7.0
  transport: streamable-http
  mcpPort: 3000
  proxyPort: 8080
  env:
    - name: UNIFI_MCP_HTTP_ENABLED
      value: "true"
    - name: UNIFI_MCP_HTTP_TRANSPORT
      value: streamable-http
    - name: UNIFI_MCP_HOST
      value: 0.0.0.0
    - name: UNIFI_MCP_PORT
      value: "3000"
    - name: UNIFI_MCP_HTTP_FORCE
      value: "true"
    - name: UNIFI_PORT
      value: "443"
  secrets:
    - name: unifi-mcp-env
      key: UNIFI_HOST
      targetEnvName: UNIFI_HOST
    - name: unifi-mcp-env
      key: UNIFI_USERNAME
      targetEnvName: UNIFI_USERNAME
    - name: unifi-mcp-env
      key: UNIFI_PASSWORD
      targetEnvName: UNIFI_PASSWORD
    - name: unifi-mcp-env
      key: UNIFI_SITE
      targetEnvName: UNIFI_SITE
    - name: unifi-mcp-env
      key: UNIFI_VERIFY_SSL
      targetEnvName: UNIFI_VERIFY_SSL
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
