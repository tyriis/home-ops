---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: unifi-network-mcp
spec:
  image: ghcr.io/sirkirby/unifi-network-mcp:0.7.0
  transport: streamable-http
  mcpPort: 3000
  proxyPort: 8080
  env:
    # HTTP is off by default; the container runs stdio unless this is set.
    - name: UNIFI_MCP_HTTP_ENABLED
      value: "true"
    - name: UNIFI_MCP_HTTP_TRANSPORT
      value: streamable-http
    - name: UNIFI_MCP_HOST
      value: 0.0.0.0
    - name: UNIFI_MCP_PORT
      value: "3000"
    - name: UNIFI_MCP_HTTP_FORCE
      value: "true"
    - name: UNIFI_PORT
      value: "443"
    # UDM SE runs UniFi OS, whose API lives behind the /proxy path. Auto-detection
    # is inconclusive on this network; the app's own warning recommends "proxy".
    # Values: proxy (UniFi OS), direct (standalone), auto.
    - name: UNIFI_CONTROLLER_TYPE
      value: proxy
    # The MCP SDK answers 421 to reverse-proxied requests unless DNS-rebinding
    # protection is off.
    - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
      value: "false"
    # Register every permitted tool directly. The default (lazy) advertises only
    # the meta-tools and routes calls through unifi_execute, which hides the real
    # tool name from the authz policy in spec.authzConfig.
    - name: UNIFI_TOOL_REGISTRATION_MODE
      value: eager
    # Never auto-confirm: a mutation that still reaches the app stops at preview.
    - name: UNIFI_AUTO_CONFIRM
      value: "false"
    # Read-only, layer 1 of 2. The image ships permissions.default.create and
    # .update as true, so ABSENCE of these vars leaves 24 mutating tools live
    # (including unifi_update_snmp_settings, which has no registration gate).
    # Every reachable category is therefore pinned to false explicitly.
    # Verified against network/v0.7.0: permissions.py treats any value that is
    # not true/1/yes/on as false.
    - name: UNIFI_PERMISSIONS_ACL_RULES_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_ACL_RULES_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_ACL_RULES_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_CLIENTS_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_CLIENTS_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_CLIENTS_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_DEVICES_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_DEVICES_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_DEVICES_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_EVENTS_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_EVENTS_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_EVENTS_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_FIREWALL_POLICIES_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_FIREWALL_POLICIES_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_FIREWALL_POLICIES_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_NETWORKS_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_NETWORKS_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_NETWORKS_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_PORT_FORWARDS_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_PORT_FORWARDS_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_PORT_FORWARDS_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_QOS_RULES_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_QOS_RULES_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_QOS_RULES_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_ROUTES_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_ROUTES_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_ROUTES_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_SNMP_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_SNMP_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_SNMP_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_TRAFFIC_ROUTES_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_TRAFFIC_ROUTES_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_TRAFFIC_ROUTES_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_USERGROUPS_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_USERGROUPS_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_USERGROUPS_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_VOUCHERS_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_VOUCHERS_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_VOUCHERS_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_VPN_CLIENTS_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_VPN_CLIENTS_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_VPN_CLIENTS_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_VPN_SERVERS_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_VPN_SERVERS_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_VPN_SERVERS_DELETE
      value: "false"
    - name: UNIFI_PERMISSIONS_WLANS_CREATE
      value: "false"
    - name: UNIFI_PERMISSIONS_WLANS_UPDATE
      value: "false"
    - name: UNIFI_PERMISSIONS_WLANS_DELETE
      value: "false"
  secrets:
    - name: unifi-mcp-env
      key: UNIFI_HOST
      targetEnvName: UNIFI_HOST
    - name: unifi-mcp-env
      key: UNIFI_USERNAME
      targetEnvName: UNIFI_USERNAME
    - name: unifi-mcp-env
      key: UNIFI_PASSWORD
      targetEnvName: UNIFI_PASSWORD
    - name: unifi-mcp-env
      key: UNIFI_SITE
      targetEnvName: UNIFI_SITE
    - name: unifi-mcp-env
      key: UNIFI_VERIFY_SSL
      targetEnvName: UNIFI_VERIFY_SSL
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
  # The operator stamps the backend pod template with mcpserver-generation only, so a
  # Secret refresh never restarts the backend. Reloader watches this StatefulSet and
  # rolls it when unifi-mcp-env changes.
  podTemplateSpec:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
  # Read-only, layer 2 of 2. The proxy evaluates Cedar before forwarding a
  # tools/call. Cedar denies by default, so the permit is required and the
  # forbid overrides it. The names are the 44 mutating tools at network/v0.7.0
  # plus the meta-tools, which proxy call_tool and would otherwise hide the real
  # tool name from this rule. A malformed policy crash-loops the proxy, so it
  # fails closed rather than silently allowing.
  authzConfig:
    type: inline
    inline:
      policies:
        - 'permit(principal, action == Action::"call_tool", resource);'
        - |
          forbid(principal, action == Action::"call_tool", resource)
          when {
            [
              "unifi_adopt_device",
              "unifi_archive_alarm",
              "unifi_archive_all_alarms",
              "unifi_authorize_guest",
              "unifi_block_client",
              "unifi_create_acl_rule",
              "unifi_create_firewall_policy",
              "unifi_create_network",
              "unifi_create_port_forward",
              "unifi_create_qos_rule",
              "unifi_create_route",
              "unifi_create_simple_firewall_policy",
              "unifi_create_simple_port_forward",
              "unifi_create_simple_qos_rule",
              "unifi_create_usergroup",
              "unifi_create_voucher",
              "unifi_create_wlan",
              "unifi_delete_acl_rule",
              "unifi_force_reconnect_client",
              "unifi_reboot_device",
              "unifi_rename_client",
              "unifi_rename_device",
              "unifi_revoke_voucher",
              "unifi_set_client_ip_settings",
              "unifi_toggle_firewall_policy",
              "unifi_toggle_port_forward",
              "unifi_toggle_qos_rule_enabled",
              "unifi_toggle_traffic_route",
              "unifi_unauthorize_guest",
              "unifi_unblock_client",
              "unifi_update_acl_rule",
              "unifi_update_device_radio",
              "unifi_update_firewall_policy",
              "unifi_update_network",
              "unifi_update_port_forward",
              "unifi_update_qos_rule",
              "unifi_update_route",
              "unifi_update_snmp_settings",
              "unifi_update_traffic_route",
              "unifi_update_usergroup",
              "unifi_update_vpn_client_state",
              "unifi_update_vpn_server_state",
              "unifi_update_wlan",
              "unifi_upgrade_device",
              "unifi_batch",
              "unifi_batch_status",
              "unifi_execute",
              "unifi_load_tools",
              "unifi_tool_index"
            ].contains(resource.name)
          };
      entitiesJson: "[]"
