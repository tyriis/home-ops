---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${APP}-proxy
spec:
  podSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: unifi-network-mcp
      app: mcpserver
  policyTypes:
    - Ingress
  ingress:
    # Envoy Gateway data plane: the only path into the MCP proxy
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
      ports:
        - protocol: TCP
          port: 8080
