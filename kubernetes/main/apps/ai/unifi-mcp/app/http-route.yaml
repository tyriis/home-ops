---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi-network-mcp
  annotations:
    external-dns/unifi: "true"
    # ToolHive serves the MCP proxy only under /mcp, so a probe of `/` is
    # answered by envoy-gateway with a 404 instead of by the app.
    gatus.home-operations.com/endpoint: |
      url: https://unifi-mcp.techtales.io/health
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames:
    - unifi-mcp.techtales.io
  parentRefs:
    - name: envoy
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - name: mcp-unifi-network-mcp-proxy
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
