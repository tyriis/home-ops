---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: github
spec:
  image: ghcr.io/github/github-mcp-server:v2.3.0@sha256:f8ee4dedc7d5c8cb32854ab91cc92a31c55a8a5510708cf8742e9f9427588ca6
  transport: stdio
  proxyPort: 8080
  env:
    - name: GITHUB_TOOLSETS
      value: repos,issues,pull_requests,actions,context
  secrets:
    # Key name matches the env var on purpose: ToolHive defaults targetEnvName to the key.
    - name: github-mcp-app
      key: GITHUB_APP_ID
    - name: github-mcp-app
      key: GITHUB_APP_INSTALLATION_ID
    - name: github-mcp-app
      key: GITHUB_APP_PRIVATE_KEY
  toolConfigRef:
    name: github-mcp-tools
  # GITHUB_READ_ONLY must stay unset: read-only mode drops the write tools that
  # mcp-tool-config.yaml allows (create_pull_request, merge_pull_request, reviews).
  authzConfig:
    type: inline
    inline:
      policies:
        - 'permit(principal, action == Action::"call_tool", resource);'
        - |
          forbid(principal, action == Action::"call_tool", resource)
          when {
            [
              "actions_run_trigger",
              "create_branch",
              "create_or_update_file",
              "create_repository",
              "delete_file",
              "delete_repository",
              "fork_repository",
              "push_files",
              "sub_issue_write",
              "update_pull_request_draft_state"
            ].contains(resource.name)
          };
      entitiesJson: "[]"
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
