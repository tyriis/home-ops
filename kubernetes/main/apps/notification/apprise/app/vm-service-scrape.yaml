---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmservicescrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: apprise
spec:
  namespaceSelector:
    matchNames:
      - notification
  selector:
    matchLabels:
      app.kubernetes.io/name: apprise
      app.kubernetes.io/instance: apprise
  endpoints:
    - port: http
      scheme: http
      path: /metrics
      interval: 1m
