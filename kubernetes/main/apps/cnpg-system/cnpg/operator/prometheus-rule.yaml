---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-default-alerts
spec:
  groups:
    - name: cnp-default.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod  }} has been waiting for longer than 5 minutes.
            summary: If a backend is waiting for longer than 5 minutes.
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 150,000,000 transactions from frozen xid on pod {{ $labels.pod }}.
            summary: Number of transactions from the frozen XID to the current one.
          expr: |-
            cnpg_pg_database_xid_age > 150000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes).
            summary: The standby is lagging behind the primary.
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}.
            summary: Checks the last time archiving failed. Will be -1 when it has not failed.
          expr: |-
            delta(cnpg_pg_stat_archiver_last_failed_time[5m]) > 0
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}.
            summary: Checks the number of database conflicts.
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
        - alert: CNPGBackupStale
          annotations:
            description: Cluster {{ $labels.job }} has no successful backup in over 48 hours (172800 seconds).
            summary: The last successful backup of a CNPG cluster is older than 48 hours.
          expr: |-
            time() - max by (job, namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 172800
          for: 1m
          labels:
            severity: warning
        - alert: CNPGBackupStaleCritical
          annotations:
            description: Cluster {{ $labels.job }} has no successful backup in over 7 days (604800 seconds).
            summary: The last successful backup of a CNPG cluster is older than 7 days.
          expr: |-
            time() - max by (job, namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 604800
          for: 1m
          labels:
            severity: critical
        - alert: CNPGBackupMetricAbsent
          annotations:
            description: No CNPG backup metric is being reported, making backup staleness monitoring blind.
            summary: The barman-cloud plugin backup metric is missing entirely.
          expr: |-
            absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 5m
          labels:
            severity: critical
