---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: flux-rules
spec:
  groups:
    - name: flux.rules
      rules:
        - alert: FluxInstanceAbsent
          annotations:
            summary: Flux instance metric is missing.
            description: |
              The flux_instance_info metric for the Flux instance in namespace {{ $labels.exported_namespace }} is not available.
          expr: |-
            absent(flux_instance_info{exported_namespace="flux-system", name="flux"})
          for: 5m
          labels:
            severity: critical

        - alert: FluxInstanceNotReady
          annotations:
            summary: Flux instance {{ $labels.name }} is not ready.
            description: |
              The Flux instance in namespace {{ $labels.exported_namespace }} is not ready.
              Reason: {{ $labels.reason }}
          expr: |-
            flux_instance_info{exported_namespace="flux-system", name="flux", ready!="True"}
          for: 5m
          labels:
            severity: critical

        - alert: FluxReconciliationFailure
          annotations:
            summary: Flux reconciliation failed.
            description: |
              {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} reconciliation has been failing for more than 15 minutes.
          expr: |-
            max(flux_resource_info{ready="False"} or flux_resource_info{ready="Unknown"}) by (exported_namespace, kind, name)
          for: 15m
          labels:
            severity: critical

        - alert: FluxReconciliationSuspended
          annotations:
            summary: Flux reconciliation suspended.
            description: |
              {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} reconciliation has been suspended for more than 15 minutes.
          expr: |-
            max(flux_resource_info{suspended="True"}) by (exported_namespace, kind, name)
          for: 15m
          labels:
            severity: warning
