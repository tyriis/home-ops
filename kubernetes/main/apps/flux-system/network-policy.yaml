---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: konflate-allow-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: konflate
  policyTypes:
    - Ingress
  ingress:
    # Allow kube-prometheus to scrape konflate metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8081
