---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app i-see-dead-pods
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: i-see-dead-pods
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
  # https://github.com/tyriis/i-see-dead-pods
  values:
    controllers:
      cron:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          schedule: "*/5 * * * *"
        pod:
          automountServiceAccountToken: true
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            runAsNonRoot: true
        containers:
          cron:
            image:
              repository: alpine/kubectl
              tag: 1.37.1@sha256:a5d0fbecab3f7b6c2ab7398f1daa73a3e0ed6ece18556d21698233e9e3759cc7
            command:
              - /bin/sh
              - -ec
              - |
                # The kubelet sets status.message on shutdown, but its next status sync overwrites it.
                # The DisruptionTarget condition keeps the marker, so read the conditions column too.
                # Do not switch this back to go-template output: app-template renders templating syntax inside values.
                kubectl get pods \
                  --all-namespaces \
                  -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,MSG:.status.message,COND:.status.conditions \
                  --no-headers \
                  | grep -F "Pod was terminated in response to imminent node shutdown." \
                  | awk '{print $1, $2}' \
                  | xargs -r -n2 kubectl delete pod -n || true
            resources:
              requests:
                cpu: 10m
                memory: 10Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    rbac:
      roles:
        i-see-dead-pods:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - pods
              verbs:
                - get
                - list
                - delete
      bindings:
        i-see-dead-pods:
          type: ClusterRoleBinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            identifier: *app
          subjects:
            - kind: ServiceAccount
              identifier: *app
              namespace: kube-tools
