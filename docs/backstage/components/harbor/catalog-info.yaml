---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: harbor
  description: Harbor is an open-source container image registry with policy-based access control and vulnerability scanning.
  links:
    - url: https://github.com/tyriis/home-ops/tree/main/kubernetes/utility/apps/harbor-system/harbor
      title: Flux definition
      icon: github
      type: github-repository
    - url: https://github.com/goharbor/harbor
      title: Upstream Repository
      icon: github
      type: github-repository
  tags:
    - registry
    - container
    - security
    - devops
spec:
  type: service
  lifecycle: production
  system: talos-flux
  owner: home-ops
  dependsOn:
    - component:cert-manager
    - component:envoy-gateway
    - component:cloudnative-pg
