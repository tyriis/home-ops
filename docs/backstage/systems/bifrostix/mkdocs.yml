---
site_name: bifrostix
site_description: bifrostix — NixOS docker-lane pilot host

nav:
  - Overview: index.md

theme:
  name: material
  features:
    - navigation.expand
    - navigation.indexes

plugins:
  - techdocs-core
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      # Enables linking to a specific line in a code block.
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - def_list
  - pymdownx.tasklist
  - pymdownx.details
  - footnotes
