---
# Include shim — the actual service definitions are shared: docker/deploy/tokentelemetry/compose.yaml.
# doco-cd runs compose in working_dir and hard-fails ("no compose files found") unless a
# compose file is resolvable there; this real file provides it. Symlinks are deliberately
# avoided (redeploy-hash churn, doco-cd #954; path-escape false positives, v0.74
# regressions #1142/#1086/#1152).
# project_directory: . is REQUIRED so relative paths inside the shared compose
# (the data volume) resolve against this host directory.
include:
  - path: ../../deploy/tokentelemetry/compose.yaml
    project_directory: .

services:
  backend:
    volumes:
      # https://tokentelemetry.com/docs/docker/#enabling-agent-mounts
      - /home/opencode/.copilot:/root/.copilot:ro
      - /home/opencode/.claude:/root/.claude:ro
