---
networks:
  apps:
    name: apps
    external: false

volumes:
  data:
    external: ${VOLUME_EXTERNAL:-false}
    name: ${VOLUME_NAME:-new-api_data}
    driver: ${VOLUME_DRIVER:-local}
  litestream-state:
    external: ${LITESTREAM_STATE_EXTERNAL:-false}
    name: ${LITESTREAM_STATE_VOLUME:-new-api_litestream-state}
    driver: local

services:
  # https://github.com/QuantumNous/new-api (OpenAI-compatible API gateway, Go + SQLite)
  # SQLite lives in /data (named volume below).
  # Docker creates named volumes root-owned, so the service UID must own it ONCE after
  # creation, otherwise SQLite fails with permission denied under the non-root `user:`:
  #   docker run --rm -v new-api_data:/data alpine chown <uid>:<gid> /data
  # SESSION_SECRET is provided via the SOPS-managed env file.
  # First boot exposes an unauthenticated setup wizard — complete it immediately from a
  # trusted machine; the endpoint is open to everyone who can reach WEB_HOST:WEB_PORT
  # until the admin account exists (then enable 2FA). Read-only rootfs is covered by the
  # /tmp tmpfs plus the writable /data volume.
  new-api:
    cap_drop:
      - ALL
    container_name: ${CONTAINER_NAME:-new-api}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: "com.docker.compose.service,com.docker.compose.image,cd.doco.deployment.config.target,org.opencontainers.image.title,org.opencontainers.image.version"
    env_file:
      - ${SOPS_ENV_FILE:-sops.env}
    environment:
      TZ: Europe/Vienna
    healthcheck:
      # Runtime stage is Debian bookworm-slim and ships wget (verified in upstream Dockerfile)
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:3000/
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    image: calciumion/new-api:v1.0.0-rc.33@sha256:68feaefb421d9e862760a7a1b574087cb062b25b8a40db7929c52497bec3fb1d
    mem_limit: 1g
    pids_limit: 128
    ports:
      - ${WEB_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=256m
    user: ${USER_ID:-1000}:${GROUP_ID:-1000}
    volumes:
      - data:/data
    networks:
      - apps

  # litestream — continuous WAL replication of /data/one-api.db to MinIO
  # (bucket litestream, prefix new-api/). The replica state DB lives on a
  # dedicated volume under XDG_DATA_HOME; without persistence every restart
  # re-snapshots the whole DB. Source is mounted read-only: replication never
  # writes to the live database.
  # First deploy: the state volume is created root-owned — chown it to the
  # service UID once, exactly like the data volume above.
  litestream:
    image: litestream/litestream:0.5.18@sha256:0512488c5fbcd5a86cc65d367542b7eb869f2fc2699c67e11f4fcec7e899e830
    container_name: ${LITESTREAM_CONTAINER_NAME:-new-api-litestream}
    command: ["replicate", "-config", "/etc/litestream.yml"]
    env_file:
      - ${LITESTREAM_SOPS_ENV_FILE:-litestream.sops.env}
    environment:
      TZ: Europe/Vienna
      XDG_DATA_HOME: /var/lib/litestream
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: "com.docker.compose.service,com.docker.compose.image,cd.doco.deployment.config.target,org.opencontainers.image.title,org.opencontainers.image.version"
    mem_limit: 64m
    pids_limit: 64
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=64m
    user: ${USER_ID:-1000}:${GROUP_ID:-1000}
    volumes:
      # rw on purpose: litestream 0.5 writes coordination tables (_litestream_seq,
      # _litestream_status) into the source database; a :ro mount fails at startup.
      - data:/data
      - ../../deploy/new-api/litestream.yml:/etc/litestream.yml:ro
      - litestream-state:/var/lib/litestream
    networks:
      - apps
