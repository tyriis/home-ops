---
volumes:
  data:
    external: ${VOLUME_EXTERNAL:-false}
    name: ${VOLUME_NAME:-doco-cd_data}
    driver: ${VOLUME_DRIVER:-local}

configs:
  poll-config.yml:
    # file: /etc/doco-cd/poll-config.yml # uncomment for synology as it does not support config.content
    content: |
      - url: https://github.com/tyriis/home-ops.git
        target: ${TARGET}
        interval: 180
        reference: main
#       # - url: https://github.com/user/repo.git
#       #   run_once: true
secrets:
  sops_age_key:
    file: ${SOPS_AGE_KEY_FILE:-/etc/doco-cd/age-keys.txt}
  webhook_secret:
    file: ${WEBHOOK_SECRET_FILE:-/etc/doco-cd/webhook_secret}
services:
  doco-cd:
    scale: 1 # scale to 0 if you want to stop the service without losing data
    # json-file with label passthrough — embeds compose/doco/OCI labels as `attrs`
    # in the log file so victoria-logs-collector can ship them (synology pattern).
    # NOTE: doco-cd is standalone per host — this change only applies when the
    # stack is manually re-upped (`docker compose up -d`) on each host.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: "com.docker.compose.service,com.docker.compose.image,cd.doco.deployment.config.target,org.opencontainers.image.title,org.opencontainers.image.version"
    configs:
      - source: poll-config.yml
        target: /poll-config.yml
    container_name: ${CONTAINER_NAME:-doco-cd}
    environment:
      HTTP_PORT: ${HTTP_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POLL_CONFIG_FILE: /poll-config.yml
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      DEPLOY_CONFIG_BASE_DIR: ./docker
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    image: ghcr.io/kimdre/doco-cd:0.129.1@sha256:9c6e7f0040056465cdbc762b608c8893c64e691d464e34928c14338a6eaf6b8f
    ports:
      - ${HTTP_PORT:-8080}:${HTTP_PORT:-8080}
    restart: unless-stopped
    secrets:
      - webhook_secret
      - sops_age_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
