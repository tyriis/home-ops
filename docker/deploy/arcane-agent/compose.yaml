---
volumes:
  data:
    external: ${VOLUME_EXTERNAL:-false}
    name: ${VOLUME_NAME:-arcane-agent_data}
    driver: ${VOLUME_DRIVER:-local}

services:
  # https://getarcane.app — Arcane Agent: pairs this Docker host to the bifrost Manager.
  # Edge mode (outbound-only, no published port): the agent connects to the Manager through
  # Traefik at MANAGER_API_URL over the poll transport, so no inbound firewall opening and no
  # Traefik gRPC/h2c setup is needed.
  # The image starts as root only to chown /app/data and drop to the non-root runtime user, so
  # do NOT add cap_drop / user: / read_only: — that breaks startup.
  # AGENT_TOKEN comes from the SOPS-managed env file.
  arcane-agent:
    container_name: ${CONTAINER_NAME:-arcane-agent}
    # json-file with label passthrough — embeds compose/doco/OCI labels as `attrs`
    # in the log file so victoria-logs-collector can ship them (synology pattern).
    # Requires rotation management since the default driver would be unbounded.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: "com.docker.compose.service,com.docker.compose.image,cd.doco.deployment.config.target,org.opencontainers.image.title,org.opencontainers.image.version"
    env_file:
      - ${SOPS_ENV_FILE:-sops.env}
    environment:
      TZ: Europe/Vienna
      EDGE_AGENT: "true"
      EDGE_TRANSPORT: ${EDGE_TRANSPORT:-poll}
      MANAGER_API_URL: ${MANAGER_API_URL:?set MANAGER_API_URL in the stack .env}
    image: ghcr.io/getarcaneapp/agent:v2.17.3@sha256:3005364d5aa603a8fe8b51bee26413b473965c3c2dc6c152b0016dd1cdda1cf4
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    volumes:
      - data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
