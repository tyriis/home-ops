---
networks:
  apps:
    name: apps
    external: false

volumes:
  config:
    external: ${VOLUME_EXTERNAL:-false}
    name: ${VOLUME_NAME:-traefik_config}
    driver: ${VOLUME_DRIVER:-local}

services:
  traefik:
    image: traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    container_name: traefik
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: "com.docker.compose.service,com.docker.compose.image,cd.doco.deployment.config.target,org.opencontainers.image.title,org.opencontainers.image.version"
    command:
      # Let's Encrypt registration email — REQUIRED. Fails fast at deploy until
      # ACME_EMAIL is set in the stack .env (docker/bifrost/traefik/.env).
      - --certificatesresolvers.cf.acme.email=${ACME_EMAIL:?set ACME_EMAIL in the stack .env}
      - --certificatesresolvers.cf.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      # Cloudflare DNS challenge — must be enabled explicitly (docs style: lowercase)
      - --certificatesresolvers.cf.acme.dnschallenge=true
      - --certificatesresolvers.cf.acme.dnschallenge.provider=cloudflare
      # OPTIONAL: Explicitly use Cloudflare resolvers to verify propagation quickly
      - --certificatesresolvers.cf.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesresolvers.cf.acme.storage=/certs/acme.json
      # Entry Points (Global HTTP to HTTPS Redirect)
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      # HTTPS Entry Point
      - --entryPoints.websecure.address=:443
      - --entryPoints.websecure.http.tls=true
      - --entryPoints.websecure.http.tls.certResolver=cf
      # Wildcard Setup
      - --entryPoints.websecure.http.tls.domains[0].main=techtales.ai
      - --entryPoints.websecure.http.tls.domains[0].sans=*.techtales.ai
      # Arcane UI on bifrost (LAN-only) — requires the Cloudflare token to cover techtales.io
      - --entryPoints.websecure.http.tls.domains[1].main=arcane.techtales.io
      # Arcane's gRPC edge tunnel is one long-lived stream; the 60s default read timeout kills it.
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=0s
      # Docker Provider
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      # Loopback-bound ping endpoint: the healthcheck probes it, and the fleet invariant
      # is that no admin/metrics port is reachable off-host (see docker/deploy/vmagent).
      - --ping=true
      - --entryPoints.traefik.address=127.0.0.1:8082
    env_file:
      # SOPS-encrypted secrets, decrypted by doco-cd at deploy time (CF_DNS_API_TOKEN;
      # token auth needs no CF_API_EMAIL / CF_API_KEY)
      - ${SOPS_ENV_FILE:-sops.env}
    networks:
      - apps
    ports:
      - ${WEB_IP:-0.0.0.0}:${HTTP_PORT:-80}:80
      - ${WEB_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443
    restart: unless-stopped
    healthcheck:
      # The healthcheck process is a fresh traefik run and does NOT inherit the
      # container's command flags: without the address it probes the default :8080
      # and reports a false unhealthy. Keep this address in sync with
      # --entryPoints.traefik.address above.
      test: ["CMD", "traefik", "healthcheck", "--ping", "--entryPoints.traefik.address=127.0.0.1:8082"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges=true
    volumes:
      - config:/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
