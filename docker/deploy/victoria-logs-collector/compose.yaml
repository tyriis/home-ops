---
volumes:
  data:
    external: ${VOLUME_EXTERNAL:-false}
    name: ${VOLUME_NAME:-victoria-logs-collector_data}
    driver: ${VOLUME_DRIVER:-local}

services:
  vlagent:
    cap_drop:
      - ALL
    command:
      - -envflag.enable=true
      - -httpListenAddr=:9500
      - -remoteWrite.url=https://logs.techtales.io/insert/jsonline?_stream_fields=hostname%2Capp&_msg_field=log
      - -remoteWrite.format=jsonline
      - "-remoteWrite.headers=Authorization: Bearer %{VL_TOKEN}"
      - -remoteWrite.tmpDataPath=/var/lib/vlagent/pending
      - -remoteWrite.maxDiskUsagePerURL=1GB
      - -fileCollector.checkpointsPath=/var/lib/vlagent/file-checkpoints.json
      - -fileCollector.streamFields=hostname,app
    container_name: victoria-logs-collector
    image: victoriametrics/vlagent:v1.53.0@sha256:a82f93ffecc153fb068606903e512368b070272739d823abe99fad0eff6e1849
    # Bridge network: the collector only needs outbound HTTPS to logs.techtales.io.
    # Metrics/health port is published on localhost only, so it is not exposed on the LAN.
    ports:
      - "127.0.0.1:9500:9500"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp
    user: "0:0"
    volumes:
      - data:/var/lib/vlagent
