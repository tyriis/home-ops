---
# Ref: https://hindsight.vectorize.io
volumes:
  # embedded PostgreSQL data (/home/hindsight/.pg0)
  data:
    external: ${VOLUME_EXTERNAL:-false}
    name: ${VOLUME_NAME:-hindsight_data}
    driver: ${VOLUME_DRIVER:-local}
  # must be a writable volume; a read-only root filesystem stops reranker startup, and a tmpfs hides the models in the image
  hf_cache:
    external: ${VOLUME_EXTERNAL_HF_CACHE:-false}
    name: ${VOLUME_NAME_HF_CACHE:-hindsight_hf_cache}
    driver: ${VOLUME_DRIVER:-local}

services:
  hindsight:
    container_name: ${CONTAINER_NAME:-hindsight}
    # renovate: datasource=docker
    image: ghcr.io/vectorize-io/hindsight:1.3.0@sha256:469ca4b49bf3863ec383cc0c509483bb58180def7c6ae0e6a592dc27369c9ff5
    mem_limit: 6g
    pids_limit: 512
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    restart: unless-stopped
    # must exceed the 60 s shutdown wait in the image entrypoint /app/start-all.sh; a SIGKILL leaves tasks in processing
    stop_grace_period: 75s
    # embedded PostgreSQL requires shm_size >= 1g
    shm_size: "1g"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${API_PORT:-8888}:8888"
      - "${HOST_BIND:-127.0.0.1}:${CP_PORT:-9999}:9999"
    # stack .env is for interpolation only; a variable reaches the container only when environment: lists it
    env_file:
      - ${SOPS_ENV_FILE:-sops.env}
    environment:
      TZ: Europe/Vienna
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:?set in stack .env}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:?set in stack .env}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL:?set in stack .env}
      # without an auth extension, the API accepts all requests
      HINDSIGHT_API_TENANT_EXTENSION: ${HINDSIGHT_API_TENANT_EXTENSION:?set in stack .env}
      # thinking off; the gateway must pass chat_template_kwargs to vLLM. With thinking on, extraction calls exceed HINDSIGHT_API_LLM_TIMEOUT.
      HINDSIGHT_API_LLM_EXTRA_BODY: ${HINDSIGHT_API_LLM_EXTRA_BODY:-{"chat_template_kwargs":{"enable_thinking":false}}}
      # a timed-out call keeps running on the upstream; each retry adds load
      HINDSIGHT_API_LLM_TIMEOUT: ${HINDSIGHT_API_LLM_TIMEOUT:-600}
      # must be greater than HINDSIGHT_API_LLM_TIMEOUT; one reflect runs up to 10 iterations
      HINDSIGHT_API_REFLECT_WALL_TIMEOUT: ${HINDSIGHT_API_REFLECT_WALL_TIMEOUT:-900}
      HINDSIGHT_API_LLM_MAX_RETRIES: ${HINDSIGHT_API_LLM_MAX_RETRIES:-2}
      HINDSIGHT_API_LLM_INITIAL_BACKOFF: ${HINDSIGHT_API_LLM_INITIAL_BACKOFF:-2}
      HINDSIGHT_API_LLM_MAX_BACKOFF: ${HINDSIGHT_API_LLM_MAX_BACKOFF:-30}
      # provider-wide cap. One slow call blocks the queue. Increase only if the queue is long.
      HINDSIGHT_API_LLM_MAX_CONCURRENT: ${HINDSIGHT_API_LLM_MAX_CONCURRENT:-2}
      # must be greater than HINDSIGHT_API_WORKER_CONSOLIDATION_RESERVED_SLOTS. Retains use only the slots above the reservation.
      HINDSIGHT_API_WORKER_MAX_SLOTS: ${HINDSIGHT_API_WORKER_MAX_SLOTS:-10}
      HINDSIGHT_API_WORKER_CONSOLIDATION_RESERVED_SLOTS: ${HINDSIGHT_API_WORKER_CONSOLIDATION_RESERVED_SLOTS:-2}
      # keep stable and unique per live replica; a new id cannot reclaim tasks stuck in processing after a hard kill
      HINDSIGHT_API_WORKER_ID: ${HINDSIGHT_API_WORKER_ID:?set in stack .env}
      # effective cap is min(this, HINDSIGHT_API_LLM_MAX_CONCURRENT)
      HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT: ${HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT:-4}
      # sends the bank id to the gateway and to the upstream provider
      HINDSIGHT_API_LLM_SEND_BANK_AS_USER: ${HINDSIGHT_API_LLM_SEND_BANK_AS_USER:-false}
      # false: facts are stored at once. Consolidation waits in pending_consolidation for the nightly drain job.
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: ${HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION:-true}
    healthcheck:
      # the image has no curl or wget; the probe uses its Python
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      # same as the upstream default of HINDSIGHT_API_STARTUP_WAIT_SECONDS
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: "com.docker.compose.service,com.docker.compose.image,cd.doco.deployment.config.target,org.opencontainers.image.title,org.opencontainers.image.version"
    read_only: true
    tmpfs:
      - /tmp:size=512m
      # embedded PostgreSQL socket directory
      - /var/run/postgresql:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    volumes:
      - data:/home/hindsight/.pg0
      - hf_cache:/home/hindsight/.cache/huggingface
