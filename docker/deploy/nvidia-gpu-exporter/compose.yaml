---
services:
  nvidia-gpu-exporter:
    container_name: nvidia-gpu-exporter
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: "com.docker.compose.service,com.docker.compose.image,cd.doco.deployment.config.target,org.opencontainers.image.title,org.opencontainers.image.version"
    # the -nvml build is cgo-linked and exits at startup unless the nvidia runtime injects libnvidia-ml.so.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    image: utkuozdemir/nvidia_gpu_exporter:1.18.0-nvml@sha256:bf82122fdf8cc960b1233e33dea82767a711343fa2919d525ca9199e83cc5195
    ports:
      - 9835:9835
    restart: unless-stopped
