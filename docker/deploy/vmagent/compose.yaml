---
# Shared template — headless vmagent for plain Docker hosts.
# Scrapes localhost exporters (see the host dir's scrape.yaml) and remote-writes to the
# central VictoriaMetrics store via the vmauth front door. One egress, one token, no
# inbound ports — hosts must never expose scrape endpoints.
#
# Host dirs provide (pattern: docker/jarvis/vmagent):
#   - compose.yaml include shim (project_directory: .) + hostname + logging block
#   - scrape.yaml               per-host targets + external_labels host=<host>
#   - sops.env                  VM_TOKEN (vmauth user <host>-metrics, /api/v1/write only)
#
# The token is interpolated by vmagent's own -envflag (%{VAR} reads the container env
# populated via env_file) — NOT compose interpolation, which expands empty here.
services:
  vmagent:
    container_name: vmagent
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: "com.docker.compose.service,com.docker.compose.image,cd.doco.deployment.config.target,org.opencontainers.image.title,org.opencontainers.image.version"
    image: docker.io/victoriametrics/vmagent:v1.156.0@sha256:d3229ab469c54ae5266e86246932266bad29b06668b5371acbd6d3de1b3035e7
    network_mode: host
    restart: unless-stopped
    # Fleet default. The central store hostname lives only in the internal split-DNS
    # zone, so the pod-owning host resolver cannot answer for it. Docker honors dns:
    # even with network_mode: host — it renders a container-local /etc/resolv.conf
    # with these nameservers. 192.168.1.1 is the techtales LAN
    # resolver. The second entry is a public fallback.
    dns:
      - 192.168.1.1
      - 1.1.1.2
    env_file:
      - ${SOPS_ENV_FILE:-sops.env}
    command:
      - -envflag.enable=true
      - -httpListenAddr=127.0.0.1:8429
      - -promscrape.config=/etc/vmagent/scrape.yaml
      - -promscrape.configCheckInterval=1m
      - -remoteWrite.url=https://metrics.techtales.io/api/v1/write
      - "-remoteWrite.headers=Authorization: Bearer %{VM_TOKEN}"
      - -remoteWrite.tmpDataPath=/var/lib/vmagent/pending
      - -remoteWrite.maxDiskUsagePerURL=1GB
    volumes:
      - ./scrape.yaml:/etc/vmagent/scrape.yaml:ro
      - data:/var/lib/vmagent
volumes:
  data:
