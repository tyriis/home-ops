---
services:
  node-exporter:
    command:
      - --path.rootfs=/host/root
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.udev.data=/host/root/run/udev/data
      - --web.listen-address=127.0.0.1:9100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    container_name: node-exporter
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: "com.docker.compose.service,com.docker.compose.image,cd.doco.deployment.config.target,org.opencontainers.image.title,org.opencontainers.image.version"
    image: quay.io/prometheus/node-exporter:v1.13.1@sha256:011e2d12c5bff759b90804bda642664775d7b4b127bf5148539bb82d3f590bb7
    mem_limit: 128m
    pids_limit: 128
    network_mode: host
    restart: unless-stopped
    volumes:
      - /:/host/root:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  smartctl-exporter:
    scale: ${ENABLE_SMARTCTL_EXPORTER:-1} # scale to 0 if you want to stop the service without losing data
    cap_add:
      - SYS_RAWIO
      # Kernel requires SYS_ADMIN for NVMe admin passthrough (smartctl reads the
      # health log at nsid=0xffffffff). Without it every NVMe SMART read fails
      # "NVME_IOCTL_ADMIN_CMD: Permission denied"; SAT/ATA reads need only RAWIO.
      - SYS_ADMIN
    cap_drop:
      - ALL
    container_name: smartctl-exporter
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: "com.docker.compose.service,com.docker.compose.image,cd.doco.deployment.config.target,org.opencontainers.image.title,org.opencontainers.image.version"
    image: ghcr.io/prometheus-community/smartctl-exporter:v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
    mem_limit: 128m
    pids_limit: 128
    # host net + loopback bind replaces the published-port pattern: a per-host
    # ports override against an include merges instead of replacing (9633 double-bind).
    # Listeners match the host vmagent scrape targets (always 127.0.0.1).
    command:
      - --web.listen-address=127.0.0.1:9633
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    # root stays: the image default user (nobody) cannot open 0600 root:root disks.
    user: root
