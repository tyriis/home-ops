---
networks:
  apps:
    name: apps
    external: false
services:
  minio:
    cap_drop:
      - ALL
    command:
      - server
      - /data
      - --console-address
      - :${CONSOLE_PORT:-9001}
    container_name: ${CONTAINER_NAME:-minio}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: "com.docker.compose.service,com.docker.compose.image,cd.doco.deployment.config.target,org.opencontainers.image.title,org.opencontainers.image.version"
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    env_file:
      - ${SOPS_ENV_FILE:-sops.env}
    environment:
      TZ: Europe/Vienna
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - apps
    ports:
      - ${API_PORT:-9000}:9000
      - ${CONSOLE_PORT:-9001}:9001
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    user: ${USER_ID:-0}:${GROUP_ID:-0}
    volumes:
      - ${DATA_PATH:-./data}:/data
