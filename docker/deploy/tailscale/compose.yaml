---
services:
  tailscale:
    scale: 1
    container_name: tailscale
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    cap_drop:
      - ALL
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ${SOPS_ENV_FILE:-sops.env}
    environment:
      TS_HOSTNAME: ${TARGET}
      TS_SOCKET: "/var/run/tailscale/tailscaled.sock"
      TS_STATE_DIR: "/var/lib/tailscale"
      TZ: "Europe/Vienna"
      UMASK: "002"
      UMASK_SET: "002"
    healthcheck:
      interval: "30s"
      retries: 5
      start_period: "15s"
      test:
        - CMD
        - tailscale
        - status
      timeout: "5s"
    image: ghcr.io/tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    network_mode: host
    platform: linux/amd64
    privileged: false
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    stdin_open: false
    tmpfs:
      - /var/run/tailscale:mode=0755
    tty: false
    # State volume is supplied per host by the include shim (compose include-merge
    # APPENDS lists, so a host cannot override a volume declared here — it must come
    # from the host file). synology: bind to ${DATA_PATH}; bifrost: named volume.
