---
global:
  scrape_interval: 1m
  external_labels:
    host: agentix

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
    relabel_configs:
      - target_label: instance
        replacement: "agentix:9100"

  - job_name: smartctl-exporter
    scrape_interval: 2m
    static_configs:
      - targets: ["127.0.0.1:9633"]
    relabel_configs:
      - target_label: instance
        replacement: "agentix:9633"

  - job_name: vmagent
    static_configs:
      - targets: ["127.0.0.1:8429"]
    relabel_configs:
      - target_label: instance
        replacement: "agentix:8429"
