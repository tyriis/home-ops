---
global:
  scrape_interval: 1m
  external_labels:
    host: agentix

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
    relabel_configs:
      - target_label: instance
        replacement: "agentix:9100"
    # Absolute-zero sentinels (-263.2, 0 K misreads) from the thermal-zone
    # passthrough chip, pinned by chip+sensor: relabeling cannot match sample
    # values, so the drop is expressed as this label identity only.
    metric_relabel_configs:
      - source_labels: [chip, sensor]
        regex: "thermal_thermal_zone0;(temp0|temp1)"
        action: drop

  - job_name: smartctl-exporter
    scrape_interval: 2m
    static_configs:
      - targets: ["127.0.0.1:9633"]
    relabel_configs:
      - target_label: instance
        replacement: "agentix:9633"

  # doco-cd self-metrics, loopback publish (docker/deploy/doco-cd)
  - job_name: doco-cd
    static_configs:
      - targets: ["127.0.0.1:9120"]
    relabel_configs:
      - target_label: instance
        replacement: "agentix:9120"

  # vlagent self-metrics: shipper backlog and drop counters
  - job_name: vlagent
    static_configs:
      - targets: ["127.0.0.1:9500"]
    relabel_configs:
      - target_label: instance
        replacement: "agentix:9500"

  - job_name: vmagent
    static_configs:
      - targets: ["127.0.0.1:8429"]
    relabel_configs:
      - target_label: instance
        replacement: "agentix:8429"
