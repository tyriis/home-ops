---
# synology host scrape config — consumed by the shared vmagent template
# (docker/deploy/vmagent/compose.yaml). Jobs match the k8s-side naming convention
# (job = exporter name); host label carries attribution instead of a cluster label.
global:
  scrape_interval: 1m
  external_labels:
    host: synology

scrape_configs:
  # node-exporter runs on host network (docker/deploy/node-exporter)
  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
    # instance is loopback and therefore identical on every host; make it fleet-unique
    relabel_configs:
      - target_label: instance
        replacement: "synology:9100"

  # no minio job yet: the scrape identity lands here after the truenas rollout
  # (docker/deploy/minio/README.md, Monitoring)

  # no smartctl job: docker/synology/node-exporter/.env sets ENABLE_SMARTCTL_EXPORTER=0,
  # so :9633 is never listening on this host

  # forward-agent self-metrics: remote-write health, queue depth, scrape counts
  - job_name: vmagent
    static_configs:
      - targets: ["127.0.0.1:8429"]
    relabel_configs:
      - target_label: instance
        replacement: "synology:8429"
