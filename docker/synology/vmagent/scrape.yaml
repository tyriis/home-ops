---
# synology host scrape config — consumed by the shared vmagent template
# (docker/deploy/vmagent/compose.yaml). Jobs match the k8s-side naming convention
# (job = exporter name); host label carries attribution instead of a cluster label.
global:
  scrape_interval: 1m
  external_labels:
    host: synology

scrape_configs:
  # node-exporter runs on host network (docker/deploy/node-exporter)
  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
    # instance is loopback and therefore identical on every host; make it fleet-unique
    relabel_configs:
      - target_label: instance
        replacement: "synology:9100"

  # metrics v3 lives on the S3 API listener (9000), not the console (9001)
  # vmagent expands %{...} in -promscrape.config from the container env (env_file), so the
  # JWT stays out of this file; the quotes are required — a bare % cannot start a YAML scalar
  - job_name: minio
    metrics_path: /minio/metrics/v3
    static_configs:
      - targets: ["127.0.0.1:9000"]
    bearer_token: "%{MINIO_METRICS_TOKEN}"
    relabel_configs:
      - target_label: instance
        replacement: "synology:9000"

  # smartctl-exporter, reached via its published port on loopback
  - job_name: smartctl-exporter
    scrape_interval: 2m
    static_configs:
      - targets: ["127.0.0.1:9633"]
    relabel_configs:
      - target_label: instance
        replacement: "synology:9633"

  # doco-cd self-metrics, loopback publish (docker/deploy/doco-cd)
  - job_name: doco-cd
    static_configs:
      - targets: ["127.0.0.1:9120"]
    relabel_configs:
      - target_label: instance
        replacement: "synology:9120"

  # vlagent self-metrics: shipper backlog and drop counters
  - job_name: vlagent
    static_configs:
      - targets: ["127.0.0.1:9500"]
    relabel_configs:
      - target_label: instance
        replacement: "synology:9500"

  # forward-agent self-metrics: remote-write health, queue depth, scrape counts
  - job_name: vmagent
    static_configs:
      - targets: ["127.0.0.1:8429"]
    relabel_configs:
      - target_label: instance
        replacement: "synology:8429"
