---
# Include shim — the actual service definition is shared: docker/deploy/victoria-logs-collector/compose.yaml.
# doco-cd runs compose in working_dir and hard-fails ("no compose files found") unless a
# compose file is resolvable there; this real file provides it. Symlinks are deliberately
# avoided (redeploy-hash churn, doco-cd #954; path-escape false positives, v0.74
# regressions #1142/#1086/#1152).
# project_directory: . is REQUIRED so relative paths inside the shared compose
# (env_file, the data volume) resolve against this host directory, not the deploy dir.
include:
  - path: ../../deploy/victoria-logs-collector/compose.yaml
    project_directory: .

services:
  vlagent:
    hostname: synology
    env_file:
      - ${SOPS_ENV_FILE:-sops.env}
    command:
      - -envflag.enable=true
      - -httpListenAddr=:9500
      - -remoteWrite.url=https://logs.techtales.io/insert/jsonline?_stream_fields=hostname%2Capp&_msg_field=log
      - -remoteWrite.format=jsonline
      - "-remoteWrite.headers=Authorization: Bearer %{VL_TOKEN}"
      - -remoteWrite.tmpDataPath=/var/lib/vlagent/pending
      - -remoteWrite.maxDiskUsagePerURL=1GB
      - -fileCollector.checkpointsPath=/var/lib/vlagent/file-checkpoints.json
      - -fileCollector.streamFields=hostname,app
      # DSM core syslog (no .log extension)
      - -fileCollector.glob=/var/log/messages
      - '-fileCollector.extraFields={"app":"system"}'
      # DSM daemons and every other .log file (kern, auth, syslog, scemd, disk,
      # iscsi, postgresql, syno* etc.)
      - -fileCollector.glob=/var/log/*.log
      - '-fileCollector.extraFields={"app":"system"}'
      # SMB
      - -fileCollector.glob=/var/log/samba/*.log
      - '-fileCollector.extraFields={"app":"smb"}'
      # DSM web server (nginx)
      - -fileCollector.glob=/var/log/nginx/*.log
      - '-fileCollector.extraFields={"app":"nginx"}'
      # systemd per-service logs
      - -fileCollector.glob=/var/log/systemd/*.log
      - '-fileCollector.extraFields={"app":"systemd"}'
      # Package Center logs
      - -fileCollector.glob=/var/log/packages/*.log
      - '-fileCollector.extraFields={"app":"packages"}'
      # Container stdout (json-file driver on shipped services)
      - -fileCollector.glob=/var/log/containers/*/*-json.log
      - '-fileCollector.extraFields={"app":"containers"}'
    volumes:
      # Whole DSM log directory, read-only (root-owned files; container runs as root)
      - /var/log:/var/log:ro
      # Container Manager data root (symlink target of /var/packages/ContainerManager/var/docker)
      - /volume1/@docker/containers:/var/log/containers:ro
