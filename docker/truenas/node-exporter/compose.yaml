---
include:
  - path: ../../deploy/node-exporter/compose.yaml
    project_directory: .

services:
  node-exporter:
    command:
      - --path.rootfs=/host/root
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.udev.data=/host/root/run/udev/data
      - --web.listen-address=127.0.0.1:9100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
  smartctl-exporter:
    command:
      - --web.listen-address=127.0.0.1:9633
    devices:
      - "/dev/sda:/dev/sda:r"
      - "/dev/sdb:/dev/sdb:r"
      - "/dev/sdc:/dev/sdc:r"
      - "/dev/sdd:/dev/sdd:r"
      - "/dev/nvme0:/dev/nvme0:r"
