---
# project_directory: . keeps relative paths in the shared compose resolving against this host dir — see docker/README.md
include:
  - path: ../../deploy/tailscale/compose.yaml
    project_directory: .

services:
  tailscale:
    volumes:
      - type: volume
        source: data
        target: /var/lib/tailscale
        read_only: false

volumes:
  data: {}
