---
# Include shim — the actual service definition is shared: docker/deploy/ollama/compose.yaml.
# doco-cd runs compose in working_dir and hard-fails ("no compose files found") unless a
# compose file is resolvable there; this real file provides it. Symlinks are deliberately
# avoided (redeploy-hash churn, doco-cd #954; path-escape false positives, v0.74
# regressions #1142/#1086/#1152).
# project_directory: . is REQUIRED so relative paths inside the shared compose
# (volumes) resolve against this host directory, not the deploy dir.
include:
  - path: ../../deploy/ollama/compose.yaml
    project_directory: .

networks:
  apps:
    name: apps
    external: false

services:
  ollama:
    networks:
      - apps
    # Pre-script: start the server, wait until it accepts connections, pull the red models
    # once (idempotent — fast no-op when already present), then stay in the foreground.
    # Replaces a separate model-puller container.
    environment:
      # Space-separated models pulled on container start. Override per host by uncommenting
      # OLLAMA_PULL_MODELS in docker/red/ollama/.env (compose example default below).
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:-gemma3:1b gemma4:e2b}
    init: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama serve &
        pid=$$!
        trap 'kill -TERM "$$pid" 2>/dev/null || true' TERM INT
        until ollama list >/dev/null 2>&1; do sleep 1; done
        for m in $${OLLAMA_PULL_MODELS:-}; do
          echo "pulling $$m"
          ollama pull "$$m" || echo "pull failed: $$m"
        done
        wait "$$pid"
    # No host ports and no Traefik labels: the API-key gate (ollama-auth) is the only
    # LAN/TLS entrypoint and reaches ollama over the shared `apps` network.
    # `!reset` drops the ports inherited from the include.
    ports: !reset []

  # Transparent OpenAI-style `Authorization: Bearer` gate in front of Ollama.
  # Ollama has no auth of its own; this rejects requests without the shared key.
  # The key comes from the SOPS-encrypted sops.env (doco-cd decrypts at deploy time and
  # exports SOPS_ENV_FILE), never from a committed label.
  ollama-auth:
    image: caddy:2.11-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    cap_drop:
      - ALL
    container_name: ollama-auth
    env_file:
      - ${SOPS_ENV_FILE:-sops.env}
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp
      - /config
      - /data
    networks:
      - apps
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.tyriis.dev`)"
      - "traefik.http.routers.ollama.entrypoints=websecure"
      - "traefik.http.services.ollama.loadbalancer.server.port=8080"
