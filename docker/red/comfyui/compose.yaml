---
# project_directory: . keeps relative paths in the shared compose resolving against this host dir — see docker/README.md
include:
  - path: ../../deploy/comfyui/compose.yaml
    project_directory: .

networks:
  apps:
    name: apps
    external: false

services:
  comfyui-nvidia:
    networks:
      - apps
    # No host ports: Traefik reaches comfyui-nvidia:8188 over the shared `apps` network
    # (https://comfyui.tyriis.dev). `!reset` drops the ports inherited from the include.
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comfyui.rule=Host(`comfyui.tyriis.dev`)"
      - "traefik.http.routers.comfyui.entrypoints=websecure"
      - "traefik.http.services.comfyui.loadbalancer.server.port=8188"

  comfyui-gallery:
    networks:
      - apps
    # No host ports: Traefik reaches comfyui-gallery:8189 over the shared `apps` network
    # (https://gallery.tyriis.dev). `!reset` drops the ports inherited from the include.
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gallery.rule=Host(`gallery.tyriis.dev`)"
      - "traefik.http.routers.gallery.entrypoints=websecure"
      - "traefik.http.services.gallery.loadbalancer.server.port=8189"
