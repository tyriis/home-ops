---
# jarvis host scrape config — consumed by the shared vmagent template
# (docker/deploy/vmagent/compose.yaml). Jobs match the k8s-side naming convention
# (job = exporter name); host label carries attribution instead of a cluster label.
global:
  scrape_interval: 1m
  external_labels:
    host: jarvis

scrape_configs:
  # node-exporter runs on host network (docker/deploy/node-exporter)
  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # smartctl-exporter, reached via its published port on loopback
  - job_name: smartctl-exporter
    scrape_interval: 2m
    static_configs:
      - targets: ["127.0.0.1:9633"]

  # doco-cd self-metrics, loopback publish (docker/deploy/doco-cd)
  - job_name: doco-cd
    static_configs:
      - targets: ["127.0.0.1:9120"]
    relabel_configs:
      - target_label: instance
        replacement: "jarvis:9120"

  # vlagent self-metrics: shipper backlog and drop counters
  - job_name: vlagent
    static_configs:
      - targets: ["127.0.0.1:9500"]
    relabel_configs:
      - target_label: instance
        replacement: "jarvis:9500"

  # forward-agent self-metrics: remote-write health, queue depth, scrape counts
  - job_name: vmagent
    static_configs:
      - targets: ["127.0.0.1:8429"]
