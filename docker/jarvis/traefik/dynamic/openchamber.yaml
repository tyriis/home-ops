---
# Host-process route. Backend dep: openchamber.service on jarvis binds
# 172.17.0.1:3000 (docker0 host gateway) — host.docker.internal resolves to it.
# Access stays gated by openchamber's --ui-password.
http:
  routers:
    openchamber:
      rule: "Host(`openchamber.tyriis.dev`)"
      entryPoints:
        - websecure
      service: openchamber
      tls:
        certResolver: cf
  services:
    openchamber:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:3000
