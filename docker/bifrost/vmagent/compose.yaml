---
# Include shim — the actual service definition is shared: docker/deploy/vmagent/compose.yaml.
# project_directory: . is REQUIRED so relative paths inside the shared compose
# (env_file, scrape.yaml bind, the data volume) resolve against this host directory.
include:
  - path: ../../deploy/vmagent/compose.yaml
    project_directory: .

# Host override
services:
  vmagent:
    hostname: bifrost
    # The host resolver cannot answer for the internal zone; metrics.techtales.io
    # exists only in split-DNS. Same resolver pair as the vlagent shim.
    # the actual host resolver pair for this subnet is 192.168.1.1
    dns:
      - 192.168.1.1
      - 1.1.1.2
    # Bifrost-only override: the daemon default is syslog; json-file embeds the attrs
    # below, which the vl-collector ships as app="containers". Remove once the block
    # lands in the shared docker/deploy/ blueprints fleet-wide.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: "com.docker.compose.service,com.docker.compose.image,cd.doco.deployment.config.target,org.opencontainers.image.title,org.opencontainers.image.version"
