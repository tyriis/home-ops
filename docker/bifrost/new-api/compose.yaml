---
# project_directory: . keeps relative paths in the shared compose resolving against this host dir — see docker/README.md
include:
  - path: ../../deploy/new-api/compose.yaml
    project_directory: .

services:
  new-api:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.newapi.rule=Host(`techtales.ai`)"
      - "traefik.http.routers.newapi.entrypoints=websecure"
      - "traefik.http.services.newapi.loadbalancer.server.port=3000"

    dns:
      - 192.168.100.1
      - 1.1.1.2
